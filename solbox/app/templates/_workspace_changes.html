{# 사업 방향·과제의 최근 칸 이력 카드. changes = workspaces.change_rows #}
{% if changes %}
<section class="card hist-card" aria-labelledby="h-hist">
  <h2 id="h-hist">변경 이력</h2>
  <ul class="hist">{% for r in changes %}<li><time>{{ kdatetime(r.when) }}</time><div>{{ r.field }} {% if r.old %}<span class="old">{{ r.old }}</span><span class="arrow" aria-label="에서">→</span>{% endif %}<b>{{ r.new or "(비움)" }}</b>{% if r.by %}<small class="by">{{ r.by }}</small>{% endif %}</div></li>{% endfor %}</ul>
</section>
{% endif %}
