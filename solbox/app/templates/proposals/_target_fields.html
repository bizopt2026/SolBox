{% from "_macros.html" import check_picker %}
<label>요청 메모
  <textarea name="request_memo" rows="4" placeholder="고객이 요청한 내용, 강조할 점 등">{{ memo }}</textarea>
</label>
<details>
  <summary>보류 단계 솔루션도 직접 추가하기</summary>
  {% if extra_candidates %}
  {{ check_picker("extra_solution_ids", "포함할 솔루션", extra_candidates, selected_ids or [], show_stage=True) }}
  {% else %}<p class="muted">직접 추가할 수 있는 보류 단계 솔루션이 없습니다.</p>{% endif %}
</details>
