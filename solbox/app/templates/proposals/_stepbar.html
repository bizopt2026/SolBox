<nav class="stepbar" id="stepbar" aria-label="제안 진행 단계"{% if oob %} hx-swap-oob="true"{% endif %}>
  <ol>
    {% for st in steps %}
    <li class="step {{ st.state }}{{ ' busy' if st.busy }}">{% if st.href %}<a href="{{ st.href }}"{% if st.state == "current" %} aria-current="step"{% endif %}>{% if st.state == "done" %}<span aria-hidden="true">✓ </span><span class="sr-only">끝남: </span>{% endif %}{{ st.label }}{% if st.busy %}<span class="busy-label">진행 중</span>{% endif %}</a>{% else %}<span aria-disabled="true">{{ st.label }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
