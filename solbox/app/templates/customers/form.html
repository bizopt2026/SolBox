{% extends "base.html" %}
{% block title %}고객 {{ "수정" if customer else "등록" }}{% endblock %}
{% block content %}
<h1>고객 {{ "수정" if customer else "등록" }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ "/customers/" ~ customer.id if customer else "/customers" }}" class="card stack">
    <label>이름 (필수) <input name="name" value="{{ form.name }}"></label>
    <label>업종 <input name="industry" value="{{ form.industry }}"></label>
    <label>연락처 <input name="contact" value="{{ form.contact }}"></label>
    <label>메모 <textarea name="memo" rows="3">{{ form.memo }}</textarea></label>
    <div class="row">
      <button type="submit">저장</button>
      <a href="{{ "/customers/" ~ customer.id if customer else "/customers" }}">취소</a>
    </div>
</form>
{% endblock %}
