{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<section class="card auth-card stack">
  <div>
    <h1>솔박스에 로그인</h1>
    <p class="muted">솔루션 발굴부터 제안서까지, 영업 기록을 한곳에서 관리하는 사내 워크스페이스예요.</p>
  </div>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>아이디 <input name="username" autocomplete="username" required autofocus></label>
    <label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">로그인</button>
  </form>
  <p class="muted help">계정이 없으면 관리자에게 요청하세요.</p>
</section>
{% endblock %}
