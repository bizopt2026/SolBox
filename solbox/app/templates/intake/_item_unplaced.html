{# 정리하지 못한 파일 카드 (저장하지 않는다). 컨텍스트: card #}
{% from "_macros.html" import plan_head %}
<section class="card plan-item" id="item-{{ card.item.key }}">
  {{ plan_head(card) }}
  <p class="muted">이 파일들은 저장되지 않습니다. 올린 원본은 남아 있어요. 필요하면 직접 등록에 쓰세요.</p>
  <ul>
    {% for n, name in card.files %}
    <li>{{ name }} — <a href="/solutions/new">솔루션 직접 등록</a> · <a href="/activities/new">활동 기록 직접 등록</a> · <a href="/intake/files/{{ intake.files[n - 1].id }}/download">내려받기</a></li>
    {% endfor %}
  </ul>
</section>
