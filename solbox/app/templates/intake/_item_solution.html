{# 새 솔루션 카드. 컨텍스트: card, choices #}
{% from "_macros.html" import plan_head, file_kind_pickers %}
{% set k = card.item.key %}{% set v = card.v %}
<section class="card plan-item" id="item-{{ k }}">
  {{ plan_head(card) }}
  <label>이름 <input name="{{ k }}__name" value="{{ v.name }}"></label>
  <label>한 줄 소개 <input name="{{ k }}__summary" value="{{ v.summary }}"></label>
  <label>설명 <textarea name="{{ k }}__description" rows="4">{{ v.description }}</textarea></label>
  <label>태그 (쉼표로 구분) <input name="{{ k }}__tags" value="{{ v.tags }}"></label>
  <div class="row">
    <label>파트너 (등록된 파트너에서 고르기)
      <select name="{{ k }}__partner">
        <option value="">선택 안 함</option>
        {% for p in choices.partner %}<option value="{{ p.id }}"{% if v.partner | string == p.id | string %} selected{% endif %}>{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    <label class="grow">또는 새 파트너 이름 <input name="{{ k }}__partner_new" value="{{ v.partner_new }}"></label>
  </div>
  {{ file_kind_pickers(card) }}
</section>
