{# 올리기 입력: 파일 선택(스크립트 없이도 동작)과 끌어다 놓기(스크립트가 더함). 부모가 <form action="/intake" enctype="multipart/form-data"> 를 연다. #}
<div class="dropzone" data-dropzone data-max-files="{{ max_files }}" data-max-mb="{{ max_mb }}">
  <label for="{{ zone_id }}-files"><span>파일 · 문서(pptx, pdf, docx, xlsx, txt, md, csv)와 사진, 음성</span></label>
  <input id="{{ zone_id }}-files" type="file" name="files" multiple required>
  <p class="muted dropzone-hint" hidden>여기로 파일을 끌어다 놓을 수도 있어요.</p>
  <p class="dropzone-summary" aria-live="polite" hidden></p>
  <ul class="dropzone-list"></ul>
  <p class="error dropzone-warn" role="alert" hidden></p>
</div>
<label><span>메모 (선택, {{ max_note }}자까지)</span>
  <input type="text" name="note" value="{{ note | default('') }}" maxlength="{{ max_note }}" placeholder="예: 신규 솔루션 후보 자료">
</label>
