<div id="intake-status" class="job-status" role="status"
  hx-get="/intake/{{ intake.id }}/status" hx-trigger="every 2s" hx-swap="outerHTML">
  {% if job is none or job.status == "pending" %}AI 대기 {{ position or 1 }}번째 (앞 작업이 끝나면 시작합니다)
  {% elif job.status == "running" %}정리 중… {{ wait_detail(job) }}
  {% else %}정리를 마무리하는 중입니다…{% endif %}
</div>
