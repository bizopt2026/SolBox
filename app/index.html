<title>Sub-3 훈련 체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header + fixed bottom tab bar; navy track + race-orange from the plan sheets */
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#111a2e; --muted:#5d6880; --line:#dde3ee;
  --navy:#111a2e; --navy-fg:#ffffff;
  --accent:#e8590c; --accent-soft:#fdeee4;
  --base:#7fb6f2; --build:#3b82f6; --spec:#1e3a8a; --rec:#c3cbd9; --taper:#f97316;
  --ok:#15803d; --ok-soft:#e3f4e8; --bad:#c2410c; --bad-soft:#fdebe2;
  --q:#2563eb; --q-soft:#e8f0fe;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#98a3ba; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#ff7a33; --accent-soft:#3a2115;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#fb8a3c;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#ff8a5c; --bad-soft:#3a1d12;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#98a3ba; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#ff7a33; --accent-soft:#3a2115;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#fb8a3c;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#ff8a5c; --bad-soft:#3a1d12;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-fg)}
header.top .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--accent);text-transform:uppercase}
.brand b{display:block;color:var(--navy-fg);letter-spacing:.02em;font-size:20px}
.dday{text-align:right;font-size:12px;opacity:.85}
.dday b{display:block;font-family:var(--f-display);font-size:22px;opacity:1}
.sync{font-size:11px;opacity:.7}

main{padding-block:16px 8px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Today */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.daynav .mid{text-align:center;flex:1}
.daynav .mid b{display:block;font-size:18px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q)}
.session{border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.session::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--stripe,var(--rec))}
.session .what{font-size:22px;font-weight:700;line-height:1.35;white-space:pre-line;margin:6px 0 4px}
.session.t-q{background:var(--q-soft)} .session.t-l,.session.t-x{background:var(--accent-soft)}
.done-btn{width:100%;margin-top:14px;padding:16px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:17px}
.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields input,.fields textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;min-width:0}
.fields .full{grid-column:1/-1}
textarea{resize:vertical;min-height:64px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ws{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;background:var(--card);font-size:12px}
.ws b{display:block;font-size:13px}
.ws .dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.ws.done .dot{background:var(--ok)} .ws.miss .dot{background:var(--bad)}
.ws.sel{border-color:var(--ink);border-width:2px}
.ws.t-q b{color:var(--q)} .ws.t-l b,.ws.t-x b{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

/* Plan */
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk>summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.wk>summary::-webkit-details-marker{display:none}
.wk .stripe{align-self:stretch;border-radius:4px;background:var(--rec)}
.wk .wn{font-family:var(--f-display);font-weight:800;font-size:18px}
.wk .wsub{font-size:12px;color:var(--muted)}
.wk .wr{text-align:right;font-size:12px;color:var(--muted)}
.wk .wr b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.wk.cur{border-color:var(--ink);border-width:2px}
.drow{display:grid;grid-template-columns:44px 1fr 40px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.drow .dl{font-size:12px;color:var(--muted);line-height:1.2}
.drow .dl b{display:block;font-size:15px;color:var(--ink)}
.drow .dt{font-size:14px;white-space:pre-line;min-width:0}
.drow.t-q .dt{color:var(--q)} .drow.t-l .dt,.drow.t-x .dt{color:var(--accent);font-weight:500}
.drow.t-r .dt{color:var(--muted)}
.drow.today{background:var(--accent-soft)}
.ck{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:18px;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.drow .act{font-size:11.5px;color:var(--ok)}

/* Records */
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.wlist{display:flex;flex-direction:column;max-height:220px;overflow:auto}
.wlist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wlist button{border:0;background:none;color:var(--muted);padding:0 4px}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.cp{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0}
.cp .goal{font-family:var(--f-display);font-weight:800;color:var(--q);font-size:16px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.runlist{display:flex;flex-direction:column;margin-top:8px}
.runlist div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.runlist .r2{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sbar .btn{white-space:nowrap}
.btn[disabled]{opacity:.5}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}

/* Guide */
.zone{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.zone .zb{height:10px;border-radius:99px;background:var(--line);position:relative}
.zone .zb i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.zone .zp{text-align:right;font-family:var(--f-display);font-weight:700}
.zone .zp small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px}
.mini b{display:block;font-family:var(--f-display);font-size:19px}
.race{display:grid;gap:8px}
.race div{border-radius:12px;padding:12px 14px;background:var(--navy);color:var(--navy-fg)}
.race div.hot{background:var(--build);color:#fff}
.race div.end{background:var(--accent);color:#fff}
.race b{font-family:var(--f-display);font-size:20px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}

.wel{display:flex;flex-direction:column;gap:14px}
.wel-top{display:flex;justify-content:space-between;align-items:center}
.wel-dots{display:flex;gap:6px}
.wel-dots i{width:22px;height:5px;border-radius:99px;background:var(--line)}
.wel-dots i.on{background:var(--accent)}
.skip{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 0}
.wel-hero{background:var(--navy);color:var(--navy-fg);border-radius:16px;padding:22px 18px}
.wel-hero .eyebrow{color:var(--accent)}
.wel-hero h1{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:8px 0 6px;text-wrap:balance}
.wel-hero p{margin:0;opacity:.85;font-size:14px}
.wel h2{font-size:21px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px;counter-increment:st}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.demo{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--card);position:relative}
.demo .tag{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.phase-row{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;margin-top:12px}
.phase-row i{height:22px;border-radius:4px}
.linkbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.linkbox input{font-size:13px;font-family:var(--f-display)}
.who{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q);margin-bottom:6px}
.gopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gopt{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.gopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gopt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gopt .gt{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.gopt .gn{font-weight:700;font-size:13px;align-self:center;text-align:right}
.gopt .gd{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.goal-hero{background:var(--navy);color:var(--navy-fg);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal-hero .eyebrow{color:var(--accent)}
.goal-hero b{font-family:var(--f-display);font-size:28px;display:block}
.adm-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-confirm{grid-column:1/-1;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.btn.danger{background:var(--bad);color:#fff}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-line}
.wel-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-bottom:-12px}
.wel-nav .btn{padding:14px;font-size:16px}
body.welcome{padding-bottom:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{white-space:nowrap;letter-spacing:-.02em}
.crew{display:flex;flex-direction:column}
.mem{border-top:1px solid var(--line);padding:12px 0}
.mem:first-child{border-top:0}
.mem>button{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%}
.mem>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;background:var(--rec)}
.av.lg{width:48px;height:48px;font-size:20px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.swatches button[aria-checked="true"]{border-color:var(--card);outline-color:var(--ink)}
.prof{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.mname{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.mname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.rest{background:transparent;border:1px dashed var(--line)}
.mstat{text-align:right;font-size:12px;color:var(--muted)}
.mstat b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.grid16{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px 6px;margin-top:10px;font-size:11px;color:var(--muted);align-items:center}
.grid16 i{width:12px;height:12px;border-radius:50%;background:var(--line);justify-self:center}
.grid16 i.ok{background:var(--ok)} .grid16 i.no{background:var(--bad)} .grid16 i.rest{background:transparent;border:1px dashed var(--line)}
.feed{display:flex;flex-direction:column;gap:10px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.post .ph{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
.post .pb{margin:10px 0 0;white-space:pre-line;font-size:14px}
.post .pkm{font-family:var(--f-display);font-weight:800;font-size:20px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.acts button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.acts svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.acts button.on svg.heart{fill:currentColor}
.cmts{margin-top:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cm{font-size:13.5px;display:flex;gap:6px;align-items:baseline}
.cm b{white-space:nowrap}
.cm span{min-width:0;overflow-wrap:anywhere}
.cm button{border:0;background:none;color:var(--muted);font-size:12px;margin-left:auto}
.cform{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:4px}
.inbox{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.inbox b{color:var(--accent);font-family:var(--f-display)}
.me-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);border-radius:10px;padding:9px 0;background:var(--card);font-weight:700}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:500}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.zguide{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.zguide div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.zguide b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.zguide small{color:var(--bad);font-weight:500}
nav.tabs button{border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){.done-btn,.ck{transition:background .15s,border-color .15s}}
</style>

function p(s){var a=s.split("-");return Date.UTC(+a[0],a[1]-1,+a[2])}
function f(t){var d=new Date(t);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(s){var d=new Date(p(s));return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}
function addDays(s,n){return f(p(s)+n*864e5)}
function idxOf(s){return Math.round((p(s)-p(START))/864e5)}
function dateOf(w,d){return addDays(START,w*7+d)}

// ---------- Personal pace engine ----------
// Plan paces were written for a sub-3 runner: MP 4:15/km, threshold (템포) 4:00/km.
// Heart-rate caps in the plan (130/140/145/158) are read as fractions of an LTHR of 168.
var REF_MAR=42.195*255, REF_THR=240, REF_LTHR=168, REF_GOAL=10799;
var DIST={"5":[5000,"5K"],"10":[10000,"10K"],"21":[21097.5,"하프"]};
var ZONES=[
 {k:"rec",n:"조깅·회복",lo:370,hi:null,hr:130,bar:15,c:"--rec"},
 {k:"e",n:"이지 (E)",lo:330,hi:370,hr:140,bar:30,c:"--base"},
 {k:"lsd",n:"LSD (일)",lo:360,hi:390,hr:130,bar:25,c:"--base"},
 {k:"wu",n:"워밍업 (WU)",lo:340,hi:360,bar:28,c:"--base"},
 {k:"cd",n:"쿨다운 (CD)",lo:340,hi:370,bar:28,c:"--base"},

 {k:"float",n:"플로트",lo:290,hi:310,bar:45,c:"--build"},

function vdotOf(dm,ts){var t=ts/60,v=dm/t,vo2=-4.6+0.182258*v+0.000104*v*v,pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);return vo2/pct}
function predictT(dm,V){var lo=dm/1000*100,hi=dm/1000*900;for(var i=0;i<60;i++){var m=(lo+hi)/2;if(vdotOf(dm,m)>V)lo=m;else hi=m}return (lo+hi)/2}
function fmtMS(s){s=Math.round(s);var m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")}
function fmtT(s){s=Math.round(s);if(s<3600)return fmtMS(s);var h=Math.floor(s/3600);return h+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function engine(){
  var p=S.profile||{},o={on:p.use!==false};
  var rt=parseTime(p.recTime),dd=DIST[p.recDist||"10"];
  if(rt&&dd){var V=vdotOf(dd[0],rt);if(V>25&&V<85){o.vdot=V;o.mar=predictT(42195,V);o.kRace=o.mar/REF_MAR}}
  var th=parseTime(p.thr);if(th&&th>=150&&th<=480){o.thr=th;o.kThr=th/REF_THR}
  var ks=[o.kRace,o.kThr].filter(Boolean);
  if(ks.length){o.kFit=Math.min(1.6,Math.max(0.75,ks.reduce(function(a,b){return a+b},0)/ks.length))}
  if(o.kRace&&o.kThr)o.gap=Math.abs(o.kRace-o.kThr)/Math.min(o.kRace,o.kThr);
  var l=+p.lthr;if(l>=120&&l<=215)o.lthr=l;
  o.curPred=o.kFit?REF_GOAL*o.kFit:null;
  if(S.goal&&S.goal.sec){o.goal=S.goal.sec;o.k=o.goal/REF_GOAL}else o.k=o.kFit;
  return o;
}
var EG={},K=1,HRK=null;
function refreshEngine(){EG=engine();K=EG.on&&EG.k?EG.k:1;HRK=EG.on&&EG.lthr?EG.lthr/REF_LTHR:null;
  var G=EG.goal,b=document.querySelector(".brand b"),eb=document.getElementById("brand-eb");

  if(eb)eb.textContent=G?"SUB-"+subLabel(G)+" · 2027.3.21":"Sub-3 · 2027.3.21"}
function subLabel(G){var m=G%60===59?(G+1)/60:Math.ceil(G/60),h=Math.floor(m/60),mm=m%60;return mm?h+":"+String(mm).padStart(2,"0"):String(h)}

function HR(orig){return HRK?Math.round(orig*HRK):orig}
function zr(z){return z.hi==null?P(z.lo)+"+":(z.lo===z.hi?P(z.lo):P(z.lo)+"~"+P(z.hi))}
function zh(z){if(z.hr)return "♥ "+HR(z.hr)+(z.hrMax?" 이하":" 미만");if(EG.on&&EG.lthr){if(z.thr)return "♥ "+Math.round(EG.lthr*0.95)+"~"+EG.lthr;if(z.above)return "♥ "+EG.lthr+"+"}return ""}
function ptxt(s){
  if(K===1)return s;

function zonesFor(t){
  var s=t[1],z=[];function add(k){if(z.indexOf(k)<0)z.push(k)}
  if(/(^|\n)E \d/.test(s))add("e");if(/WU/.test(s))add("wu");if(/@5:10/.test(s))add("mpf");

function memStats(m,w){
  var d=(m&&m.d)||{},done=0,n=0,km=0,dots=[];
  for(var k=0;k<7;k++){var ds=dateOf(w,k),t=W[w].d[k],ok=d[ds]!==undefined;
    if(t[0]!=="r"){n++;if(ok)done++}if(ok)km+=d[ds]>0?d[ds]:t[2];
    dots.push(t[0]==="r"&&!ok?"rest":ok?"ok":(ds<T?"no":""))}
  var tot=0,dn=0,last=Math.min(TOTAL,idxOf(T)+1);
  for(var i=0;i<last;i++){var ds2=dateOf(Math.floor(i/7),i%7),t2=W[Math.floor(i/7)].d[i%7];if(t2[0]!=="r"){tot++;if(d[ds2]!==undefined)dn++}}
  return{done:done,n:n,km:Math.round(km*10)/10,dots:dots,rate:tot?Math.round(dn/tot*100):null,dn:dn,tot:tot};
}
