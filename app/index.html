.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:500}

.daynav .mid b{display:block;font-size:18px}

.fields .full{grid-column:1/-1}
textarea{resize:vertical;min-height:64px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ws{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;background:var(--card);font-size:12px}
.ws b{display:block;font-size:13px}
.ws .dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}

.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

// ---------- Dates ----------
function p(s){var a=s.split("-");return Date.UTC(+a[0],a[1]-1,+a[2])}
function f(t){var d=new Date(t);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(s){var d=new Date(p(s));return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}
function addDays(s,n){return f(p(s)+n*864e5)}
function idxOf(s){return Math.round((p(s)-p(START))/864e5)}
function dateOf(w,d){return addDays(START,w*7+d)}
var TOTAL=W.length*7;

// ---------- State ----------
var LS="sub3-train-v1";
var S={days:{},weights:{},checks:{}};
function lsGet(){try{var v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function merge(o){if(!o)return;S.days=o.days||{};S.weights=o.weights||{};S.checks=o.checks||{};S.ts=o.ts||0}
merge(lsGet());

var docRef=null, saveTimer=null, syncEl=document.getElementById("sync");
function setSync(t){syncEl.textContent=t}
setSync("이 기기에 저장");
function save(){
  S.ts=Date.now(); lsSet();
  if(!docRef){setSync("이 기기에 저장");return}
  setSync("저장 중…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    docRef.set({json:JSON.stringify(S),ts:S.ts}).then(function(){setSync("계정에 저장됨")},function(){setSync("이 기기에만 저장")});
  },700);
}
(async function(){
  try{
    if(!window.claude||!window.claude.use){return}
    var user=await window.claude.use("user"); var db=await window.claude.use("db");
    if(!user||!db)return;
    var id=await user.id(); if(!id)return;
    var ref=db.collection("data/users/"+id).doc("plan");
    var timer=setTimeout(function(){setSync("이 기기에 저장")},10000);
    var snap=await ref.get(); clearTimeout(timer);
    docRef=ref;
    if(snap.exists){
      var d=snap.data(); var remote=null; try{remote=JSON.parse(d.json)}catch(e){}
      if(remote&&(remote.ts||0)>=(S.ts||0)){merge(remote);lsSet();render()}
      else if(S.ts){save()}
    } else if(S.ts){save()}
    setSync("계정에 저장됨");
  }catch(e){setSync("이 기기에 저장")}
})();

// ---------- Helpers ----------
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayRec(ds){return S.days[ds]||{}}
function weekStats(w){var done=0,km=0,n=0;for(var d=0;d<7;d++){var t=W[w].d[d];var r=dayRec(dateOf(w,d));if(t[0]!=="r"){n++;if(r.done)done++}if(r.done)km+=(r.km!=null&&r.km!==""?+r.km:t[2])}return{done:done,n:n,km:Math.round(km*10)/10}}
function phColor(w){return "var("+PH[W[w].ph][1]+")"}
function parseTime(s){if(!s)return null;var a=String(s).trim().split(":").map(Number);if(a.some(isNaN))return null;if(a.length===2)return a[0]*60+a[1];if(a.length===3)return a[0]*3600+a[1]*60+a[2];return null}
function checkState(c){var v=S.checks[c.id];if(v==null||v==="")return null;if(c.kind==="time"){var t=parseTime(v);if(t==null)return null;return t<=c.lim}var n=parseFloat(v);if(isNaN(n))return null;return n<=c.lim}

var T=todayStr();
var sel=(function(){var i=idxOf(T);if(i<0)return START;if(i>=TOTAL)return RACE;return T})();
var tab="today"; var openWeeks={};
(function(){var i=idxOf(T);openWeeks[Math.max(0,Math.min(15,Math.floor(i/7)))]=true})();

var dd=Math.round((p(RACE)-p(T))/864e5);
document.getElementById("dday").textContent=dd>0?"D-"+dd:(dd===0?"D-DAY":"완주!");

var view=document.getElementById("view");

  if(tab==="today")vToday(); else if(tab==="plan")vPlan(); else if(tab==="log")vLog(); else vGuide();
}

  h+='<div class="session t-'+t[0]+'" style="--stripe:'+phColor(w)+'"><div class="eyebrow">'+(t[0]==="q"?"수요일 포인트 훈련":t[0]==="l"?"토요일 지속주·롱런":t[0]==="c"?"일요일 회복":t[0]==="x"?"대회일":t[0]==="r"?"휴식일":"이지 런")+(t[2]?' · 약 '+t[2]+'km':'')+'</div><div class="what">'+esc(t[1])+'</div>';
  if(t[0]==="r"){h+='<div class="small muted">푹 쉬기. 다리가 무거우면 스트레칭만.</div>'}
  h+='<button class="done-btn'+(r.done?' on':'')+'" id="done">'+(r.done?'✓ 완료했어요':(t[0]==="r"?'휴식 완료 체크':'훈련 완료 체크'))+'</button>';
  if(t[0]!=="r"){
    h+='<div class="fields"><label>실제 거리 (km)<input id="f-km" inputmode="decimal" placeholder="'+t[2]+'" value="'+esc(r.km)+'"></label><label>평균 심박<input id="f-hr" inputmode="numeric" placeholder="bpm" value="'+esc(r.hr)+'"></label><label>시간 / 페이스<input id="f-pace" placeholder="예: 52:10 · 5:12/km" value="'+esc(r.pace)+'"></label><label>컨디션 (1~5)<input id="f-rpe" inputmode="numeric" placeholder="3" value="'+esc(r.rpe)+'"></label><label class="full">메모<textarea id="f-note" placeholder="몸 상태, 보급, 날씨…">'+esc(r.note)+'</textarea></label></div>';
  }
  h+='</div>';
  // week strip
  h+='<div class="card"><div class="row between"><h2>W'+(w+1)+' 이번 주</h2><span class="small muted num">'+st.km+' / '+W[w].km+' km</span></div><div class="bar" style="margin:10px 0 12px"><i style="width:'+pct+'%;background:'+phColor(w)+'"></i></div><div class="week-strip">';
  for(var k=0;k<7;k++){var ds=dateOf(w,k),tk=W[w].d[k],rk=dayRec(ds),past=ds<T;
    var cls="ws t-"+tk[0]+(ds===sel?" sel":"")+(rk.done?" done":(past&&tk[0]!=="r"?" miss":""));
    h+='<button class="'+cls+'" data-go="'+ds+'"><span class="muted">'+DOW[k]+'</span><b class="num">'+(tk[0]==="r"?"휴":tk[2])+'</b><div class="dot"></div></button>'}
  h+='</div><div class="small muted" style="margin-top:8px">완료 '+st.done+'/'+st.n+'회 · 숫자는 계획 거리(km)</div></div>';
  // food

function vPlan(){
  var tot=0,dn=0,km=0;for(var w=0;w<16;w++){var s=weekStats(w);tot+=s.n;dn+=s.done;km+=s.km}
  var h='<div class="card"><div class="row between"><h2>16주 전체 진행</h2><span class="num small muted">'+dn+' / '+tot+'회</span></div><div class="bar" style="margin:10px 0 6px"><i style="width:'+Math.round(dn/tot*100)+'%"></i></div><div class="small muted">누적 <b class="num" style="color:var(--ink)">'+Math.round(km)+'</b> km · 계획 총 1,119 km</div></div>';
  for(var w=0;w<16;w++){
    var s=weekStats(w),cur=Math.floor(idxOf(T)/7)===w;
    h+='<details class="wk'+(cur?' cur':'')+'" data-w="'+w+'"'+(openWeeks[w]?' open':'')+'><summary><span class="stripe" style="background:'+phColor(w)+'"></span><span><span class="wn">W'+(w+1)+'</span> <span class="small" style="font-weight:700;color:'+phColor(w)+'">'+esc(W[w].lab)+'</span><span class="wsub" style="display:block">'+md(dateOf(w,0))+' – '+md(dateOf(w,6))+' · 완료 '+s.done+'/'+s.n+'</span></span><span class="wr"><b>'+s.km+'<span class="muted small">/'+W[w].km+'K</span></b></span></summary>';
    if(openWeeks[w]){for(var d=0;d<7;d++){var ds=dateOf(w,d),t=W[w].d[d],r=dayRec(ds);
      var extra=[];if(r.km)extra.push(r.km+"km");if(r.hr)extra.push("♥"+r.hr);if(r.pace)extra.push(r.pace);
      h+='<div class="drow t-'+t[0]+(ds===T?' today':'')+'"><button class="dl" data-open="'+ds+'" style="border:0;background:none;text-align:left;padding:0"><b>'+DOW[d]+'</b>'+md(ds)+'</button><div class="dt">'+esc(t[1])+(extra.length?'<div class="act">'+esc(extra.join(" · "))+'</div>':'')+'</div><button class="ck'+(r.done?' on':'')+'" data-ck="'+ds+'" aria-label="'+md(ds)+' 완료">✓</button></div>'}}
    h+='</details>';
  }
  h+='<p class="small muted">날짜를 누르면 그날 기록(거리·심박·메모) 화면으로 이동해요. 토요일이 센 주(10·11·13주차)에 수요일 피로가 남으면 수요일 반복을 1회 줄입니다.</p>';
  view.innerHTML=h;

  view.querySelectorAll("[data-ck]").forEach(function(b){b.onclick=function(){var ds=b.dataset.ck,r=S.days[ds]||{};r.done=!r.done;S.days[ds]=r;save();var y=window.scrollY;render();window.scrollTo(0,y)}});
  view.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){sel=b.dataset.open;tab="today";render();window.scrollTo(0,0)}});
}

function chart(){
  var x0=p("2026-11-29"),x1=p("2027-03-21"),y0=66.5,y1=73.5,Wd=340,Hd=170,L=30,R=16,Tp=10,B=22;
  function X(t){return L+(t-x0)/(x1-x0)*(Wd-L-R)} function Y(v){return Tp+(y1-v)/(y1-y0)*(Hd-Tp-B)}
  var s='<svg viewBox="0 0 '+Wd+' '+Hd+'" width="100%" role="img" aria-label="체중 추이와 목표">';
  [67,68,69,70,71,72,73].forEach(function(v){s+='<line x1="'+L+'" x2="'+(Wd-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>'});
  var up="",lo="";WT.forEach(function(m,i){up+=(i?"L":"M")+X(p(m[0]))+" "+Y(m[2]);});for(var i=WT.length-1;i>=0;i--){lo+="L"+X(p(WT[i][0]))+" "+Y(WT[i][1])}
  s+='<path d="'+up+lo+'Z" fill="var(--q-soft)" stroke="none"/>';
  s+='<path d="'+WT.map(function(m,i){return (i?"L":"M")+X(p(m[0]))+" "+Y((m[1]+m[2])/2)}).join("")+'" fill="none" stroke="var(--q)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  WT.forEach(function(m){s+='<text x="'+X(p(m[0]))+'" y="'+(Hd-6)+'" text-anchor="middle">'+md(m[0])+'</text>'});
  var pts=Object.keys(S.weights).filter(function(k){var t=p(k);return t>=x0-7*864e5&&t<=x1}).sort();
  if(pts.length){var path=pts.map(function(k,i){return (i?"L":"M")+X(Math.max(x0,p(k))).toFixed(1)+" "+Y(Math.max(y0,Math.min(y1,S.weights[k]))).toFixed(1)}).join("");
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
    var lk=pts[pts.length-1];s+='<circle cx="'+X(Math.max(x0,p(lk)))+'" cy="'+Y(Math.max(y0,Math.min(y1,S.weights[lk])))+'" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>'}
  return s+'</svg>';
}

  var keys=Object.keys(S.weights).sort().reverse();
  var h='<div class="card"><div class="row between"><h2>체중</h2><span class="small muted">'+(keys.length?'최근 <b class="num" style="color:var(--ink)">'+S.weights[keys[0]]+'kg</b>':'목표 72.5 → 67.5~68.5kg')+'</span></div>';
  h+=chart();
  h+='<div class="small muted" style="display:flex;gap:14px;margin:2px 0 10px"><span><span style="color:var(--q)">┅</span> 목표 범위</span><span><span style="color:var(--accent)">━</span> 내 기록</span></div>';
  h+='<form class="wform" id="wf"><input class="inp" type="date" id="w-date" value="'+T+'" aria-label="날짜"><input class="inp" id="w-val" inputmode="decimal" placeholder="kg" aria-label="체중"><button class="btn" type="submit">기록</button></form>';
  h+='<div class="wlist" style="margin-top:8px">'+(keys.length?keys.map(function(k){return '<div><span class="num">'+md(k)+'</span><span><b class="num">'+S.weights[k]+'</b> kg <button data-del="'+k+'" aria-label="삭제">✕</button></span></div>'}).join(""):'<div class="muted small" style="border:0">아침 공복 체중을 기록해 보세요.</div>')+'</div>';
  h+='<dl class="kv small" style="margin-top:12px">'+WT.map(function(m){return '<dt class="num">'+md(m[0])+'</dt><dd>'+(m[1]===m[2]?m[1]:m[1]+'~'+m[2])+'kg · '+m[3]+'</dd>'}).join("")+'</dl></div>';
  // checkpoints
  var miss=0;h+='<div class="card"><h2>세 번의 점검</h2>';
  CHECKS.forEach(function(c){var stt=checkState(c);if(stt===false)miss++;
    h+='<div class="cp"><div><div class="small muted">'+c.wk+'</div><b>'+c.name+'</b><div class="goal">'+c.goal+'</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:stretch"><input class="inp" id="c-'+c.id+'" data-cp="'+c.id+'" placeholder="'+c.ph+'" value="'+esc(S.checks[c.id])+'" inputmode="'+(c.kind==="hr"?"numeric":"text")+'"><span class="pill '+(stt===null?'na':stt?'ok':'bad')+'" style="text-align:center">'+(stt===null?'미측정':stt?'통과':'미달')+'</span></div></div>'});
  h+=miss>=2?'<div class="warn">두 개 이상 미달이에요. 목표를 3:02~3:03 (4:19/km)으로 조정하고 PB 경신을 노리세요.</div>':'<div class="small muted">두 개 이상 못 미치면 목표를 3:02~3:03 (4:19/km)으로 조정합니다.</div>';
  h+='</div>';
  view.innerHTML=h;
  document.getElementById("wf").onsubmit=function(e){e.preventDefault();var d=document.getElementById("w-date").value,v=parseFloat(document.getElementById("w-val").value.replace(",","."));if(!d||isNaN(v)||v<30||v>200)return;S.weights[d]=Math.round(v*10)/10;save();render()};
  view.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){delete S.weights[b.dataset.del];save();render()}});
  view.querySelectorAll("[data-cp]").forEach(function(el){el.addEventListener("change",function(){S.checks[el.dataset.cp]=el.value.trim();save();render()})});
}

function vGuide(){
