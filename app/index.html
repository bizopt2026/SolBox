var C={busy:false,msg:"",err:""};
function durSec(s){var a=String(s||"").split(":").map(Number);if(a.some(isNaN))return 0;return a.length===3?a[0]*3600+a[1]*60+a[2]:a.length===2?a[0]*60+a[1]:0}
function fmtPace(sec,km){if(!km)return"";var p=sec/km,m=Math.floor(p/60),s=Math.round(p%60);if(s===60){m++;s=0}return m+":"+String(s).padStart(2,"0")}
function localDate(ts){var d=new Date(ts*1000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ymd(s){return s.replace(/-/g,"")}
function payloadText(res){if(!res)return"";if(typeof res.payload==="string")return res.payload;var c=res.content||[];for(var i=0;i<c.length;i++){if(c[i].type==="text")return c[i].text}return typeof res.payload==="object"?JSON.stringify(res.payload):""}
function parseRuns(txt){
  var out=[];String(txt).split(/\n(?=\d+\.\s)/).forEach(function(b){
    var id=(b.match(/LabelId:\s*(\d+)/)||[])[1];if(!id)return;
    var head=b.match(/^\d+\.\s+(.+?)\s+[—-]\s+(\d{4}-\d{2}-\d{2})/m);
    var ts=+((b.match(/startTimestamp=(\d+)/)||[])[1]||0);
    var km=parseFloat((b.match(/Distance:\s*([\d.]+)\s*km/)||[])[1]);
    var dur=durSec((b.match(/Duration:\s*([\d:]+)/)||[])[1]);
    var hr=+((b.match(/Avg HR:\s*(\d+)/)||[])[1]||0);
    var pace=(b.match(/Average Pace:\s*([\d:]+)/)||[])[1]||"";
    var sport=+((b.match(/SportType:\s*(\d+)/)||[])[1]||100);
    var date=ts?localDate(ts):(head?head[2]:"");if(!date||isNaN(km))return;
    out.push({id:id,date:date,ts:ts,km:km,dur:dur,hr:hr||null,pace:pace,name:head?head[1]:"Run",sport:sport});
  });return out;
}
var ERRMSG={server_not_connected:"COROS 커넥터가 연결되어 있지 않아요. Claude 설정 → 커넥터에서 COROS를 연결해 주세요.",needs_reauth:"COROS 연결이 만료됐어요. Claude 설정 → 커넥터에서 COROS를 다시 연결해 주세요.",not_in_manifest:"이 페이지의 COROS 사용이 허용되지 않았어요. 페이지 권한 메뉴에서 COROS를 허용해 주세요.",approval_required:"COROS 불러오기 승인이 필요해요. 버튼을 눌러 다시 시도해 주세요.",selection_required:"COROS 커넥터가 여러 개예요. 사용할 커넥터를 선택해 주세요.",blocked_by_policy:"조직 정책으로 COROS 사용이 막혀 있어요.",server_unavailable:"COROS 서버가 응답하지 않아요. 잠시 후 다시 시도해 주세요."};
async function corosSync(fromClick){
  if(C.busy)return;C.busy=true;C.err="";C.msg="코로스에서 불러오는 중…";render();
  try{
    var mcp=window.claude&&window.claude.use?await window.claude.use("mcp"):null;
    if(!mcp){C.err="이 화면에서는 COROS 연동을 쓸 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.";return}
    var from=addDays(T<START?T:START,-14);
    if(S.corosFrom&&S.corosFrom<=from&&S.corosAt){var last=localDate(Math.floor(S.corosAt/1000));var f2=addDays(last,-3);if(f2>from)from=f2}
    var res=await mcp.callTool("COROS","querySportRecords",{startDate:ymd(from),endDate:ymd(T),sportTypeCodes:[100,101,102,103],limit:200},{cache:fromClick?{refresh:true,staleTime:0,gcTime:600000}:{staleTime:600000,gcTime:600000}});
    var runs=parseRuns(payloadText(res));
    runs.forEach(function(r){S.coros[r.id]=r});
    if(!S.corosFrom||from<S.corosFrom)S.corosFrom=from;
    S.corosAt=Date.now();S.corosOn=true;
    C.msg=runs.length?runs.length+"개 러닝을 불러왔어요.":"새 러닝 기록이 없어요.";
    save();
  }catch(e){var code=e&&e.code;C.err=ERRMSG[code]||("불러오지 못했어요"+(e&&e.message?": "+e.message:"."));C.msg=""}
  finally{C.busy=false;render()}
}

// ---------- Personal pace engine ----------
// Plan paces were written for a sub-3 runner: MP 4:15/km, threshold (템포) 4:00/km.
// Heart-rate caps in the plan (130/140/145/158) are read as fractions of an LTHR of 168.
var REF_MAR=42.195*255, REF_THR=240, REF_LTHR=168, REF_GOAL=10799;
var DIST={"5":[5000,"5K"],"10":[10000,"10K"],"21":[21097.5,"하프"]};
var ZONES=[
 {k:"rec",n:"조깅·회복",lo:370,hi:null,hr:130,bar:15,c:"--rec"},
 {k:"e",n:"이지 (E)",lo:330,hi:370,hr:140,bar:30,c:"--base"},
 {k:"lsd",n:"LSD (일)",lo:360,hi:390,hr:130,bar:25,c:"--base"},
 {k:"wu",n:"워밍업 (WU)",lo:340,hi:360,bar:28,c:"--base"},
 {k:"cd",n:"쿨다운 (CD)",lo:340,hi:370,bar:28,c:"--base"},
 {k:"mpf",n:"MP 롱런 앞부분",lo:310,hi:310,hr:145,hrMax:true,bar:40,c:"--build"},
 {k:"float",n:"플로트",lo:290,hi:310,bar:45,c:"--build"},
 {k:"steady",n:"지속주",lo:265,hi:280,bar:55,c:"--build"},
 {k:"mp",n:"마라톤 (MP)",lo:253,hi:255,hr:158,hrMax:true,bar:65,c:"--q"},
 {k:"tempo",n:"템포 (역치)",lo:238,hi:245,thr:true,bar:80,c:"--taper"},
 {k:"int",n:"인터벌",lo:222,hi:228,above:true,bar:100,c:"--bad"}];
function vdotOf(dm,ts){var t=ts/60,v=dm/t,vo2=-4.6+0.182258*v+0.000104*v*v,pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);return vo2/pct}
function predictT(dm,V){var lo=dm/1000*100,hi=dm/1000*900;for(var i=0;i<60;i++){var m=(lo+hi)/2;if(vdotOf(dm,m)>V)lo=m;else hi=m}return (lo+hi)/2}
function fmtMS(s){s=Math.round(s);var m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")}
function fmtT(s){s=Math.round(s);if(s<3600)return fmtMS(s);var h=Math.floor(s/3600);return h+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function engine(){
  var p=S.profile||{},o={on:p.use!==false};
  var rt=parseTime(p.recTime),dd=DIST[p.recDist||"10"];
  if(rt&&dd){var V=vdotOf(dd[0],rt);if(V>25&&V<85){o.vdot=V;o.mar=predictT(42195,V);o.kRace=o.mar/REF_MAR}}
  var th=parseTime(p.thr);if(th&&th>=150&&th<=480){o.thr=th;o.kThr=th/REF_THR}
  var ks=[o.kRace,o.kThr].filter(Boolean);
  if(ks.length){o.k=Math.min(1.6,Math.max(0.75,ks.reduce(function(a,b){return a+b},0)/ks.length))}
  if(o.kRace&&o.kThr)o.gap=Math.abs(o.kRace-o.kThr)/Math.min(o.kRace,o.kThr);
  var l=+p.lthr;if(l>=120&&l<=215)o.lthr=l;
  return o;
}
var EG={},K=1,HRK=null;
function refreshEngine(){EG=engine();K=EG.on&&EG.k?EG.k:1;HRK=EG.on&&EG.lthr?EG.lthr/REF_LTHR:null;
  var b=document.querySelector(".brand b");if(b)b.textContent=K!==1?"내 목표 "+fmtT(REF_GOAL*K):"2:59:59 프로젝트"}
function P(sec){return fmtMS(sec*K)}
function HR(orig){return HRK?Math.round(orig*HRK):orig}
function zr(z){return z.hi==null?P(z.lo)+"+":(z.lo===z.hi?P(z.lo):P(z.lo)+"~"+P(z.hi))}

function ptxt(s){
  if(K===1)return s;
  s=s.replace(/\((\d{1,2}:\d{2}(?::\d{2})?) 이내\)/g,function(m,a){return "("+fmtT(parseTime(a)*K)+" 이내)"});
  s=s.replace(/목표 2:59:59/,"목표 "+fmtT(REF_GOAL*K));
  return s.replace(/(^|[^\d:])(\d):([0-5]\d)(?![\d:])/g,function(m,pre,a,b){return pre+P(+a*60+ +b)});
}
function zonesFor(t){
  var s=t[1],z=[];function add(k){if(z.indexOf(k)<0)z.push(k)}
  if(/(^|\n)E \d/.test(s))add("e");if(/WU/.test(s))add("wu");if(/@5:10/.test(s))add("mpf");
  if(/MP/.test(s))add("mp");if(/플로트/.test(s))add("float");if(/지속주|빌드업|변속/.test(s))add("steady");if(/템포/.test(s))add("tempo");
  if(/LSD/.test(s))add("lsd");if(/조깅/.test(s)&&t[0]!=="q")add("rec");if(/CD/.test(s))add("cd");
  return z.map(function(k){return ZONES.filter(function(x){return x.k===k})[0]});

}

  var p=S.profile||{},rd=p.recDist||"10",e=EG;
  var h='<div class="card"><h2>내 기준 입력</h2><p class="small muted" style="margin:2px 0 12px">입력한 값으로 16주 훈련표의 모든 페이스와 심박 기준을 내 수준에 맞게 바꿔요.</p>';
  h+='<div class="fields" style="margin-top:0"><label>역치 심박 (bpm)<input id="p-lthr" inputmode="numeric" placeholder="예: 168" value="'+esc(p.lthr)+'"></label><label>역치 페이스 (/km)<input id="p-thr" placeholder="예: 4:02" value="'+esc(p.thr)+'"></label></div>';
  h+='<div class="sbar" style="margin-top:8px"><span class="small muted" style="min-width:0">'+(FIT.err?'<span style="color:var(--bad)">'+esc(FIT.err)+'</span>':esc(FIT.msg||"코로스 체력 평가의 역치 페이스를 불러올 수 있어요."))+'</span><button class="btn ghost" id="p-coros"'+(FIT.busy?' disabled':'')+'>코로스에서 가져오기</button></div>';
  h+='<div style="margin-top:14px"><div class="small muted" style="margin-bottom:6px">최근 기록</div><div class="seg" role="radiogroup">'+Object.keys(DIST).map(function(k){return '<button role="radio" aria-checked="'+(rd===k)+'" data-rd="'+k+'">'+DIST[k][1]+'</button>'}).join("")+'</div>';
  h+='<div class="fields"><label>기록<input id="p-rec" placeholder="'+(rd==="21"?"예: 1:26:30":rd==="5"?"예: 19:30":"예: 40:10")+'" value="'+esc(p.recTime)+'"></label><label>측정일<input id="p-recdate" type="date" value="'+esc(p.recDate)+'"></label></div></div>';
  h+='<label class="tog"><input type="checkbox" id="p-use"'+(p.use!==false?' checked':'')+'><span>훈련표·가이드에 내 페이스 적용</span></label></div>';
  // results
  if(e.k){
    var pctv=Math.round((e.k-1)*1000)/10, dsec=Math.round(255*e.k-255);
    h+='<div class="card"><div class="row between"><h2>분석 결과</h2>'+(e.on?'<span class="pill ok">적용 중</span>':'<span class="pill na">원본 표시 중</span>')+'</div><div class="grid2" style="margin-top:10px">';
    if(e.vdot)h+='<div class="mini"><div class="small muted">VDOT ('+DIST[rd][1]+' 기록)</div><b>'+e.vdot.toFixed(1)+'</b></div><div class="mini"><div class="small muted">예상 마라톤</div><b>'+fmtT(e.mar)+'</b></div>';
    if(e.thr)h+='<div class="mini"><div class="small muted">역치 페이스</div><b>'+fmtMS(e.thr)+'<span class="small muted">/km</span></b></div>';
    h+='<div class="mini"><div class="small muted">내 마라톤 페이스</div><b>'+fmtMS(255*e.k)+'<span class="small muted">/km</span></b></div>';
    h+='<div class="mini"><div class="small muted">내 목표 기록</div><b>'+fmtT(REF_GOAL*e.k)+'</b></div>';
    if(e.lthr)h+='<div class="mini"><div class="small muted">역치 심박</div><b>'+e.lthr+'<span class="small muted"> bpm</span></b></div>';
    h+='</div><p class="small" style="margin:10px 0 0">'+(Math.abs(pctv)<0.5?'원본 서브3 페이스와 거의 같아요.':'원본 서브3 페이스보다 km당 <b>'+Math.abs(dsec)+'초 '+(dsec>0?'느리게':'빠르게')+'</b> ('+(pctv>0?'+':'')+pctv+'%) 맞췄어요.')+(e.kRace&&e.kThr?' 기록과 역치 페이스를 반반 반영했어요.':'')+'</p>';
    if(e.gap>0.03)h+='<div class="warn" style="margin-top:8px">기록 기준과 역치 페이스 기준이 '+Math.round(e.gap*100)+'% 차이나요. 오래된 기록이거나 역치 페이스가 정확하지 않을 수 있어요. 둘 중 최근 값을 확인해 주세요.</div>';
    if(e.mar&&e.mar>REF_GOAL)h+='<p class="small muted" style="margin:8px 0 0">현재 예상 기록으로는 서브3까지 '+fmtT(e.mar-REF_GOAL)+' 남았어요. W8·W12 점검 기록을 넣으면 다시 계산해요.</p>';
    else if(e.mar)h+='<p class="small muted" style="margin:8px 0 0">현재 예상 기록이 이미 서브3 안쪽이에요.</p>';
    h+='</div>';
  } else {
    h+='<div class="card"><h2>분석 결과</h2><p class="small muted" style="margin:6px 0 0">역치 페이스나 최근 5K·10K·하프 기록 중 하나만 넣어도 페이스를 계산해요. 지금은 원본 서브3 페이스(MP 4:15/km)를 보여 주고 있어요.</p></div>';
  }
  if(p.coros&&p.coros.at){var c=p.coros;h+='<div class="card"><div class="row between"><h2>코로스 체력 평가</h2><span class="small muted">'+ago(c.at)+'</span></div><dl class="kv" style="margin-top:8px">'+(c.vo2?'<dt>VO2max</dt><dd class="num">'+esc(c.vo2)+'</dd>':'')+(c.k5?'<dt>5K 예측</dt><dd class="num">'+esc(c.k5)+'</dd>':'')+(c.k10?'<dt>10K 예측</dt><dd class="num">'+esc(c.k10)+'</dd>':'')+(c.half?'<dt>하프 예측</dt><dd class="num">'+esc(c.half)+'</dd>':'')+(c.mar?'<dt>마라톤 예측</dt><dd class="num">'+esc(c.mar)+'</dd>':'')+'</dl><p class="small muted" style="margin:8px 0 0">예측값은 참고용이에요. 실제로 뛴 기록을 "최근 기록"에 넣는 게 더 정확해요.</p></div>'}
  // zones
  h+='<div class="card"><div class="row between"><h2>내 훈련 존</h2><span class="small muted">'+(K!==1?'원본 대비':'원본 그대로')+'</span></div><div style="margin-top:8px">'+ZONES.map(function(z){var hh=zh(z);return '<div class="zone"><span>'+z.n+'</span><span class="zb"><i style="width:'+z.bar+'%;background:var('+z.c+')"></i></span><span class="zp">'+zr(z)+(hh?'<small>'+hh+'</small>':'')+(K!==1?'<small class="muted" style="color:var(--muted)">원본 '+(z.hi==null?fmtMS(z.lo)+"+":z.lo===z.hi?fmtMS(z.lo):fmtMS(z.lo)+"~"+fmtMS(z.hi))+'</small>':'')+'</span></div>'}).join("")+'</div>';
  h+='<p class="small muted" style="margin:8px 0 0">'+(HRK?'심박 기준은 역치 심박의 비율로 계산해요 (회복·LSD 77%, 이지 83%, MP 롱런 앞부분 86%, MP 94%).':'역치 심박을 넣으면 심박 기준도 내 몸에 맞게 바뀌어요.')+' 심박 기준이 있는 존은 페이스보다 심박이 우선이에요.</p></div>';
  // upcoming
  var ks=nextKeySessions();
  if(ks.length){h+='<div class="card"><h2>다가오는 핵심 훈련</h2><div class="runlist">';
    ks.forEach(function(x){h+='<div style="grid-template-columns:60px 1fr"><span class="num muted">W'+(x[2]+1)+'<br>'+md(x[0])+' '+DOW[idxOf(x[0])%7]+'</span><span style="white-space:pre-line">'+esc(ptxt(x[1][1]))+'</span></div>'});
    h+='</div></div>'}
  view.innerHTML=h;
  function setP(k,v){S.profile=S.profile||{};S.profile[k]=v;save();var y=window.scrollY;render();window.scrollTo(0,y)}
  [["p-lthr","lthr"],["p-thr","thr"],["p-rec","recTime"],["p-recdate","recDate"]].forEach(function(a){var el=document.getElementById(a[0]);el.addEventListener("change",function(){setP(a[1],el.value.trim())})});
  document.getElementById("p-use").onchange=function(){setP("use",this.checked)};
  view.querySelectorAll("[data-rd]").forEach(function(b){b.onclick=function(){setP("recDist",b.dataset.rd)}});
  document.getElementById("p-coros").onclick=corosFitness;
}

function vGuide(){
  var h='<div class="card"><div class="row between"><h2>페이스 존</h2>'+(K!==1?'<span class="pill ok">내 페이스</span>':'')+'</div><div style="margin-top:8px">'+ZONES.filter(function(z){return ["rec","e","lsd","steady","mp","tempo","int"].indexOf(z.k)>=0}).map(function(z){var hh=zh(z);return '<div class="zone"><span>'+z.n+'</span><span class="zb"><i style="width:'+z.bar+'%;background:var('+z.c+')"></i></span><span class="zp">'+zr(z)+(hh?'<small>'+hh+'</small>':'')+'</span></div>'}).join("")+'</div><p class="small muted" style="margin:8px 0 0">빨간 심박 기준이 있는 존은 페이스보다 심박이 우선. 심박이 넘으면 페이스를 늦춘다. 내 기준은 "내 페이스" 탭에서 바꿀 수 있어요.</p></div>';
  var Zk={};ZONES.forEach(function(z){Zk[z.k]=z});
  h+='<div class="card"><h2>약어</h2><dl class="kv" style="margin-top:8px"><dt>E</dt><dd>이지 '+zr(Zk.e)+' · '+zh(Zk.e)+'</dd><dt>WU</dt><dd>워밍업 '+zr(Zk.wu)+' · 2~3K 조깅 후 스트라이드 4회</dd><dt>CD</dt><dd>쿨다운 '+zr(Zk.cd)+' · 아주 편하게</dd><dt>MP</dt><dd>'+P(255)+'/km (시계 기준 '+P(252)+'~'+P(253)+')</dd><dt>MP 롱런 앞부분</dt><dd>'+P(310)+' · '+zh(Zk.mpf)+'</dd><dt>플로트</dt><dd>'+zr(Zk.float)+' (MP 반복 사이 1K)</dd><dt>회복 LSD</dt><dd>'+zr(Zk.lsd)+' · '+zh(Zk.lsd)+'</dd></dl></div>';
  h+='<div class="card"><h2>레이스 데이 페이스</h2><div class="race" style="margin-top:10px"><div><div class="small" style="opacity:.75">0~5km</div><b>'+P(256)+'~'+P(258)+'</b></div><div class="hot"><div class="small" style="opacity:.85">5~30km · 하프 통과 '+fmtT(5340*K)+'~'+fmtT(5370*K)+'</div><b>'+P(252)+'~'+P(253)+' /km</b></div><div class="end"><div class="small" style="opacity:.85">30km~ 버티기</div><b>보폭 유지 · 팔치기</b></div></div><p class="small muted" style="margin:8px 0 0">시계 페이스 기준 · 3/18~20 카보 로딩</p></div>';
  h+='<div class="card"><h2>요일별 먹는 양</h2><div class="grid2" style="margin-top:10px">'+FOOD.map(function(x){return '<div class="mini"><div class="small muted">'+x.k+'</div><b>'+x.kcal+' kcal</b><div class="small">탄수 '+x.carb+'</div></div>'}).join("")+'</div><ul class="tight" style="margin-top:12px"><li>단백질 매일 120~140g: 계란·닭가슴살·생선·두부·그릭요거트, 끼니마다 30g</li><li>훈련 전후: 3시간 전 밥·식빵+꿀+바나나 → 중 시간당 60~90g 젤 → 1시간 내 초코우유 500ml</li><li>줄일 것: 야식·술·튀김. 훈련 전후 탄수화물은 줄이지 않는다</li><li>감량은 베이스기에 몰고, 테이퍼부터는 멈춘다</li></ul></div>';
  h+='<div class="card"><h2>한 주의 리듬</h2><ul class="tight" style="margin-top:8px"><li>핵심 훈련은 수·토 두 번, 나머지는 천천히</li><li>일요일은 걷기를 섞어도 되고, 다리가 무거우면 조깅 30분이나 휴식으로</li><li>근력은 화·목 이지런 뒤 20~30분</li></ul></div>';
  h+='<div class="card"><h2>백업</h2><p class="small muted" style="margin:4px 0 10px">기록은 계정에 자동 저장돼요. 혹시 몰라 백업 코드를 복사해 둘 수 있어요.</p><div class="row"><button class="btn ghost" id="bk">백업 코드 복사</button><button class="btn ghost" id="rs">복원하기</button></div><textarea class="inp" id="bk-text" style="margin-top:10px;font-size:12px" hidden></textarea><button class="btn" id="rs-go" style="margin-top:8px" hidden>이 코드로 복원</button><div class="small" id="bk-msg" style="margin-top:6px"></div></div>';
  view.innerHTML=h;
  var ta=document.getElementById("bk-text"),msg=document.getElementById("bk-msg"),go=document.getElementById("rs-go");
  document.getElementById("bk").onclick=function(){var t=JSON.stringify(S);ta.hidden=false;ta.value=t;go.hidden=true;
    try{navigator.clipboard.writeText(t).then(function(){msg.textContent="복사했어요. 메모 앱에 붙여 넣어 두세요."},function(){ta.select();msg.textContent="아래 코드를 길게 눌러 복사하세요."})}catch(e){ta.select();msg.textContent="아래 코드를 길게 눌러 복사하세요."}};
  document.getElementById("rs").onclick=function(){ta.hidden=false;ta.value="";go.hidden=false;msg.textContent="백업 코드를 붙여 넣고 복원을 누르세요. 지금 기록은 덮어써집니다.";ta.focus()};
  go.onclick=function(){try{var o=JSON.parse(ta.value);if(!o||typeof o!=="object"||!o.days)throw 0;merge(o);save();msg.textContent="복원했어요."}catch(e){msg.textContent="코드를 읽지 못했어요. 전체를 빠짐없이 붙여 넣었는지 확인하세요."}};
}

document.querySelectorAll("nav.tabs button").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render();window.scrollTo(0,0)}});
render();
})();
</script>
