<title>Sub-3 훈련 체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header + fixed bottom tab bar; navy track + race-orange from the plan sheets */
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#111a2e; --muted:#5d6880; --line:#dde3ee;
  --navy:#111a2e; --navy-fg:#ffffff;
  --accent:#e8590c; --accent-soft:#fdeee4;
  --base:#7fb6f2; --build:#3b82f6; --spec:#1e3a8a; --rec:#c3cbd9; --taper:#f97316;
  --ok:#15803d; --ok-soft:#e3f4e8; --bad:#c2410c; --bad-soft:#fdebe2;
  --q:#2563eb; --q-soft:#e8f0fe;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#98a3ba; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#ff7a33; --accent-soft:#3a2115;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#fb8a3c;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#ff8a5c; --bad-soft:#3a1d12;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#98a3ba; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#ff7a33; --accent-soft:#3a2115;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#fb8a3c;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#ff8a5c; --bad-soft:#3a1d12;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-fg)}
header.top .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--accent);text-transform:uppercase}
.brand b{display:block;color:var(--navy-fg);letter-spacing:.02em;font-size:20px}
.dday{text-align:right;font-size:12px;opacity:.85}
.dday b{display:block;font-family:var(--f-display);font-size:22px;opacity:1}
.sync{font-size:11px;opacity:.7}

main{padding-block:16px 8px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Today */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.daynav .mid{text-align:center;flex:1}
.daynav .mid b{display:block;font-size:18px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q)}
.session{border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.session::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--stripe,var(--rec))}
.session .what{font-size:22px;font-weight:700;line-height:1.35;white-space:pre-line;margin:6px 0 4px}
.session.t-q{background:var(--q-soft)} .session.t-l,.session.t-x{background:var(--accent-soft)}
.done-btn{width:100%;margin-top:14px;padding:16px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:17px}
.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:44px;line-height:1.2;text-align:left;box-sizing:border-box;padding-left:8px!important;padding-right:6px!important}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.fields input,.fields textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;min-width:0}
.fields .full{grid-column:1/-1}
textarea{resize:vertical;min-height:64px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ws{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;background:var(--card);font-size:12px}
.ws b{display:block;font-size:13px}
.ws .dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.ws.done .dot{background:var(--ok)} .ws.miss .dot{background:var(--bad)}
.ws.sel{border-color:var(--ink);border-width:2px}
.ws.t-q b{color:var(--q)} .ws.t-l b,.ws.t-x b{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

/* Plan */
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk>summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.wk>summary::-webkit-details-marker{display:none}
.wk .stripe{align-self:stretch;border-radius:4px;background:var(--rec)}
.wk .wn{font-family:var(--f-display);font-weight:800;font-size:18px}
.wk .wsub{font-size:12px;color:var(--muted)}
.wk .wr{text-align:right;font-size:12px;color:var(--muted)}
.wk .wr b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.wk.cur{border-color:var(--ink);border-width:2px}
.drow{display:grid;grid-template-columns:44px 1fr 40px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.drow .dl{font-size:12px;color:var(--muted);line-height:1.2}
.drow .dl b{display:block;font-size:15px;color:var(--ink)}
.drow .dt{font-size:14px;white-space:pre-line;min-width:0}
.drow.t-q .dt{color:var(--q)} .drow.t-l .dt,.drow.t-x .dt{color:var(--accent);font-weight:500}
.drow.t-r .dt{color:var(--muted)}
.drow.today{background:var(--accent-soft)}
.ck{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:18px;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.drow .act{font-size:11.5px;color:var(--ok)}

/* Records */
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.wlist{display:flex;flex-direction:column;max-height:220px;overflow:auto}
.wlist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wlist button{border:0;background:none;color:var(--muted);padding:0 4px}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.cp{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0}
.cp .goal{font-family:var(--f-display);font-weight:800;color:var(--q);font-size:16px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.runlist{display:flex;flex-direction:column;margin-top:8px}
.runlist div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.runlist .r2{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sbar .btn{white-space:nowrap}
.btn[disabled]{opacity:.5}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}

/* Guide */
.zone .zn{color:var(--accent);font-weight:700;margin-left:1px;line-height:0;font-size:12px;vertical-align:4px}
.znote{font-size:12px;color:var(--muted);margin:2px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg)}
.zone{display:grid;grid-template-columns:88px 1fr 112px;gap:10px;align-items:start;padding:5px 0;font-size:14px;min-height:44px}
.zone.z3{min-height:58px}
.zone .zn0{white-space:nowrap;line-height:22px}
.zone .zb{margin-top:6px}
.zone .zp{line-height:22px}
.zone .zb{height:10px;border-radius:99px;background:var(--line);position:relative}
.zone .zb i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.zone .zp{text-align:right;font-family:var(--f-display);font-weight:700}
.zone .zp small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;white-space:nowrap;line-height:1.4}
.zone .zp .hr{color:var(--bad)}
.zone .zp small.lap{color:var(--q);font-weight:700}
.zone .zp .lap{color:var(--q);font-weight:700}
.zone .zp .og{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px}
.mini b{display:block;font-family:var(--f-display);font-size:19px}
.race{display:grid;gap:8px}
.race>div{border-radius:12px;padding:12px 14px;background:var(--navy);color:var(--navy-fg)}
.race>div.hot{background:var(--build);color:#fff}
.race>div.end{background:var(--accent);color:#fff}
.race b{font-family:var(--f-display);font-size:20px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}

.wel{display:flex;flex-direction:column;gap:14px}
.wel-top{display:flex;justify-content:space-between;align-items:center}
.wel-dots{display:flex;gap:6px}
.wel-dots i{width:22px;height:5px;border-radius:99px;background:var(--line)}
.wel-dots i.on{background:var(--accent)}
.skip{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 0}
.wel-hero{background:var(--navy);color:var(--navy-fg);border-radius:16px;padding:22px 18px}
.wel-hero .eyebrow{color:var(--accent)}
.wel-hero h1{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:8px 0 6px;text-wrap:balance}
.wel-hero p{margin:0;opacity:.85;font-size:14px}
.wel h2{font-size:21px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px;counter-increment:st}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.demo{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--card);position:relative}
.demo .tag{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.phase-row{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;margin-top:12px}
.phase-row i{height:22px;border-radius:4px}
.linkbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.linkbox input{font-size:13px;font-family:var(--f-display)}
.who{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q);margin-bottom:6px}
.gopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gopt{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.gopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gopt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gopt .gt{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.gopt .gn{font-weight:700;font-size:13px;align-self:center;text-align:right}
.gopt .gd{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.goal-hero{background:var(--navy);color:var(--navy-fg);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal-hero .eyebrow{color:var(--accent)}
.goal-hero b{font-family:var(--f-display);font-size:28px;display:block}
.adm-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-confirm{grid-column:1/-1;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.btn.danger{background:var(--bad);color:#fff}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-line}
.wg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.wg summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.wg summary::-webkit-details-marker{display:none}
.wg summary::after{content:"＋";color:var(--muted);font-weight:400}
.wg[open] summary::after{content:"－"}
.fold-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;min-width:0;width:100%;border-radius:8px}
.fold-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold-h h2{margin:0;white-space:nowrap}
.fold-s{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.chev{flex:none;margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--bg)}
.chev::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.fold-h[aria-expanded="true"] .chev::before{transform:translateY(2px) rotate(-135deg)}
.card.folded{padding-block:12px}
[hidden]{display:none!important}
.ifold-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);background:var(--card)}
.ifold-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:24px}
.srow+.srow{border-top:1px solid var(--line)}
.srow .sl{flex:none;width:22px;text-align:center}
.srow .sm{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sm b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}
.sbtn[disabled]{opacity:.5}
.keys{display:flex;flex-direction:column;margin-top:6px}
.key{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.key:first-child{border-top:0}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.key .kd{display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.3}
.key .kd b{font-size:14px;color:var(--ink);font-family:var(--f-display)}
.key .kt{font-size:13.5px;min-width:0}
.key.t-q .kd span{color:var(--q)} .key.t-l .kd span,.key.t-x .kd span{color:var(--accent)}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.segm button{border:0;background:transparent;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.segm button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.wcard .wlist div{padding:5px 0}
.splits{width:100%;border-collapse:collapse;font-size:13px}
.splits th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
.splits td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.splits tr.krow td{background:var(--accent-soft);font-weight:700}
.rchk{display:flex;flex-direction:column;gap:8px}
.rchk>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rchk>div.hot{border-color:var(--accent)}
.rchk ul{margin:6px 0 0}
.rchk .go,.rchk .adj{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;margin-right:4px}
.rchk .go{background:var(--ok-soft);color:var(--ok)}
.rchk .adj{background:var(--bad-soft);color:var(--bad)}
.mbars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mb{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.mb .ml{color:var(--muted)}
.mb .mt{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mb .mt i{display:block;height:100%;border-radius:99px}
.mb .mv{font-size:12px;color:var(--muted);white-space:nowrap}.mb .mv b{color:var(--ink);font-size:13px}
.meals{display:flex;flex-direction:column;margin-top:10px}
.meal{border-top:1px solid var(--line);padding:8px 0}
.meal summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.meal summary::-webkit-details-marker{display:none}
.meal .mty{font-weight:700;white-space:nowrap}.meal .mnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.meal .mk{font-weight:700}
.mi{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.madd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.rgrid>div{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:10px;background:var(--bg)}

}

  var rows=ids.map(function(u){return{u:u,m:CREW.members[u],s:memStats(CREW.members[u],0)}}).sort(function(a,b2){return (b2.m.upd||0)-(a.m.upd||0)});

  rows.forEach(function(r){var tk=0,km=0,d=r.m.d||{};for(var k in d){var i=idxOf(k);if(i<0||i>=TOTAL)continue;var t=W[Math.floor(i/7)].d[i%7];if(t[0]!=="r"){tk++;km+=d[k]>0?d[k]:t[2]}}
    h+='<div class="adm-row">'+avatar(r.u)+'<div style="min-width:0"><div class="mname"><span>'+esc(nickOf(r.u))+'</span>'+(r.u===CREW.me?'<em class="me-tag" style="font-style:normal">관리자</em>':'')+'</div><div class="small muted">'+(r.m.goal?'목표 '+esc(r.m.goal)+' · ':'')+'완료 '+tk+'회 · '+Math.round(km)+'km'+(r.s.rate!=null?' · 이행 '+r.s.rate+'%':'')+'</div><div class="small muted">'+(r.m.upd?'최근 '+new Date(r.m.upd).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):'')+'</div></div>'+(r.u===CREW.me?'<span></span>':'<button class="btn ghost" data-ban="'+esc(r.u)+'" style="padding:8px 12px">제외</button>');
    if(CREW.confirm===r.u)h+='<div class="adm-confirm"><span><b>'+esc(nickOf(r.u))+'</b>님을 크루에서 제외할까요? 크루 목록·피드·좋아요·댓글에서 사라지고, 다시 허용하기 전까지 공유할 수 없어요.</span><div class="row"><button class="btn danger" data-ban-go="'+esc(r.u)+'">제외하기</button><button class="btn ghost" data-ban-no>취소</button></div></div>';
    h+='</div>'});
  h+='</div></div>';
  var bk=Object.keys(b);
  h+='<div class="card"><h2>제외한 크루원 '+bk.length+'명</h2><div style="margin-top:6px">';
  if(!bk.length)h+='<p class="small muted" style="margin:0">제외한 사람이 없어요.</p>';
  bk.forEach(function(u){h+='<div class="adm-row"><span class="av" style="background:var(--rec)" aria-hidden="true">'+esc(Array.from(b[u].nick||"?")[0])+'</span><div style="min-width:0"><b>'+esc(b[u].nick||"러너")+'</b><div class="small muted">'+(b[u].at?new Date(b[u].at).toLocaleDateString("ko-KR")+' 제외':'')+'</div></div><button class="btn ghost" data-unban="'+esc(u)+'" style="padding:8px 12px">다시 허용</button></div>'});
  h+='</div></div>';
  h+='<p class="small muted">앱은 링크를 아는 누구나 열 수 있어요. 여기서 제외하면 그 사람은 크루 목록·피드에서 빠지고 다시 공유할 수 없어요. 공유를 꺼 둔 사람은 목록에 나오지 않아요.</p>';
  return h;
}
function bindAdmin(){
  document.getElementById("a-save").onclick=function(){var m=document.getElementById("a-msg");saveSettings({name:document.getElementById("a-name").value.trim().slice(0,20),notice:document.getElementById("a-notice").value.trim().slice(0,200)}).then(function(){m.textContent="저장했어요.";m.style.color="var(--ok)"},function(){m.textContent="저장하지 못했어요. 다시 시도해 주세요.";m.style.color="var(--bad)"})};
  view.querySelectorAll("[data-ban]").forEach(function(x){x.onclick=function(){CREW.confirm=x.dataset.ban;keep()}});
  view.querySelectorAll("[data-ban-no]").forEach(function(x){x.onclick=function(){CREW.confirm=null;keep()}});
  view.querySelectorAll("[data-ban-go]").forEach(function(x){x.onclick=function(){var u=x.dataset.banGo,bb=JSON.parse(JSON.stringify((CREW.settings&&CREW.settings.banned)||{}));bb[u]={nick:nickOf(u),at:Date.now()};CREW.confirm=null;
    saveSettings({banned:bb}).then(function(){CREW.db.doc("members/"+u).delete().catch(function(){});CREW.db.doc("social/"+u).delete().catch(function(){})},function(){});keep()}});
  view.querySelectorAll("[data-unban]").forEach(function(x){x.onclick=function(){var bb=JSON.parse(JSON.stringify((CREW.settings&&CREW.settings.banned)||{}));delete bb[x.dataset.unban];saveSettings({banned:bb});keep()}});
}

  }

    var posts=[];ids.forEach(function(id){var d=(CREW.members[id]||{}).d||{};Object.keys(d).forEach(function(ds){var i=idxOf(ds);if(i<0||i>=TOTAL||W[Math.floor(i/7)].d[i%7][0]==="r")return;posts.push({id:id,ds:ds,km:d[ds],t:W[Math.floor(i/7)].d[i%7],w:Math.floor(i/7)})})});
    posts.sort(function(a,b){return a.ds<b.ds?1:a.ds>b.ds?-1:(a.id<b.id?-1:1)});posts=posts.slice(0,40);

      h+='<div class="pb">'+esc(x.t[1].split("\n").slice(0,3).join(" · "))+'</div>';
      h+='<div class="acts"><button class="'+(liked?'on':'')+'" data-like="'+esc(k)+'" aria-pressed="'+liked+'">'+HEART+'좋아요'+(n?' '+n:'')+'</button><button data-cmt="'+esc(k)+'" aria-expanded="'+op+'">'+BUBBLE+'댓글'+(cs.length?' '+cs.length:'')+'</button></div>';
      if(op||cs.length){h+='<div class="cmts">'+cs.slice(op?0:-2).map(function(c){return '<div class="cm"><b>'+esc(nickOf(c.u))+'</b><span>'+esc(c.t)+'</span>'+(c.u===CREW.me?'<button data-del-c="'+c.at+'" aria-label="댓글 삭제">삭제</button>':'')+'</div>'}).join("");
        if(!op&&cs.length>2)h+='<button class="small muted" data-cmt="'+esc(k)+'" style="border:0;background:none;text-align:left;padding:0">댓글 '+cs.length+'개 모두 보기</button>';
        if(op)h+='<form class="cform" data-cf="'+esc(k)+'"><input class="inp" id="cin-'+esc(k)+'" maxlength="140" placeholder="응원 한마디" aria-label="댓글"><button class="btn" type="submit">등록</button></form>';
        h+='</div>'}
      h+='</article>'});

    view.querySelectorAll("[data-cmt]").forEach(function(b){b.onclick=function(){CREW.cOpen=CREW.cOpen===b.dataset.cmt?null:b.dataset.cmt;keep();var el=document.getElementById("cin-"+CREW.cOpen);if(el)el.focus()}});
    view.querySelectorAll("[data-cf]").forEach(function(f){f.onsubmit=function(e){e.preventDefault();if(AUTH.st!=="ok"){window.scrollTo(0,0);return}if(!S.nick){CREW.needNick=true;keep();window.scrollTo(0,0);return}var inp=f.querySelector("input"),t=inp.value.trim().slice(0,140);if(!t)return;var M=myS();M.cmts.push({k:f.dataset.cf,t:t,at:Date.now()});if(M.cmts.length>300)M.cmts=M.cmts.slice(-300);writeSocial();keep()}});
    view.querySelectorAll("[data-del-c]").forEach(function(b){b.onclick=function(){var at=+b.dataset.delC,M=myS();M.cmts=M.cmts.filter(function(c){return c.at!==at});writeSocial();keep()}});
    return;
  }
  h+='<div class="daynav"><button id="cw-prev" aria-label="이전 주">‹</button><div class="mid"><span class="chip" style="background:transparent;color:'+phColor(w)+';padding:0">'+esc(W[w].lab)+'</span><b class="num">'+wn(w)+' · '+md(dateOf(w,0))+'–'+md(dateOf(w,6))+'</b></div><button id="cw-next" aria-label="다음 주">›</button></div>';
  h+='<div class="card"><div class="crew">';
  if(!ids.length)h+='<p class="small muted" style="margin:0">아직 공유한 사람이 없어요. 페이지 공유 메뉴에서 크루를 초대하면 각자 체크한 현황이 여기에 모여요.</p>';
  var rows=ids.map(function(id){return{id:id,m:CREW.members[id],s:memStats(CREW.members[id],w)}});
  rows.sort(function(a,b){return (b.s.done-a.s.done)||(b.s.km-a.s.km)||((b.s.rate||0)-(a.s.rate||0))});
  rows.forEach(function(r){var me=r.id===CREW.me,open=CREW.open===r.id;
    h+='<div class="mem"><button data-mem="'+esc(r.id)+'" aria-expanded="'+open+'">'+avatar(r.id)+'<div style="min-width:0"><div class="mname"><span>'+esc(nickOf(r.id))+'</span>'+(me?'<em class="me-tag" style="font-style:normal">나</em>':'')+'</div><div class="dots">'+r.s.dots.map(function(c){return '<i class="'+c+'"></i>'}).join("")+'</div><div class="small muted">'+(r.m.bio?esc(r.m.bio)+' · ':'')+(r.m.goal?'목표 '+esc(r.m.goal)+' · ':'')+'누적 이행 '+(r.s.rate==null?'-':r.s.rate+'%')+'</div></div><div class="mstat"><b>'+r.s.done+'/'+r.s.n+'</b>'+r.s.km+'/'+W[w].km+'km</div></button>';
    if(open){h+='<div class="grid16"><span></span>'+DOW.map(function(x){return '<span style="text-align:center">'+x+'</span>'}).join("");
      for(var wi=0;wi<W.length;wi++){var st=memStats(r.m,wi);h+='<span class="num">'+wn(wi)+'</span>'+st.dots.map(function(c){return '<i class="'+c+'"></i>'}).join("")}
      var all=memStats(r.m,0);h+='</div><div class="small muted" style="margin-top:8px">지금까지 '+all.dn+'/'+all.tot+'회 완료'+(r.m.upd?' · '+new Date(r.m.upd).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+' 업데이트':'')+'</div>'}
    h+='</div>'});
  h+='</div></div><p class="small muted">초록은 완료, 빨강은 지난 훈련일 미완료, 점선은 휴식일이에요. 이름을 누르면 전체 일정을 볼 수 있어요.</p>';
  view.innerHTML=h;bindShare();bindCrewCommon(ids);
  document.getElementById("cw-prev").onclick=function(){if(CREW.wk>0){CREW.wk--;keep()}};

function profCard(){
  if(AUTH.st==="anon"||AUTH.st==="view")return '<div class="card"><h2>크루에 참여하려면</h2><p class="small muted" style="margin:6px 0 0">'+(AUTH.st==="anon"?'claude.ai에 로그인한 뒤 이 링크를 다시 열어 주세요. 로그인하면 닉네임을 정하고 크루와 훈련 현황을 공유할 수 있어요.</p><div class="row" style="margin-top:10px"><a class="btn" href="https://claude.ai/login" target="_blank" rel="noopener" style="text-decoration:none">claude.ai 로그인</a></div>':'이 계정은 관리자와 다른 claude.ai 조직이라 크루 기능을 쓸 수 없어요. 크루 현황은 볼 수 있지만 공유·좋아요·댓글은 저장되지 않아요. 관리자에게 같은 조직(팀)으로 초대해 달라고 요청하세요.</p>')+'</div>';
  var editing=!S.nick||CREW.editP,h='<div class="card" id="prof">';
  if(!editing){
    h+='<h2>내 프로필</h2><div class="prof" style="margin-top:10px">'+avatar(CREW.me||"me",true)+'<div style="min-width:0"><b>'+esc(S.nick)+'</b><div class="small muted">'+(S.bio?esc(S.bio):'한마디를 남겨 보세요')+'</div></div><button class="btn ghost" id="p-edit">수정</button></div>';
    h+='<label class="tog"><input type="checkbox" id="share-tog"'+(S.share!==false?' checked':'')+'><span>내 훈련 현황 공유</span></label><p class="small muted" style="margin:6px 0 0">닉네임과 완료한 날짜·거리만 공유돼요. claude.ai 이름·사진, 메모·심박·체중은 공유되지 않아요.</p></div>';
    return h;
  }
  var dup=false,nn=(CREW.draft&&CREW.draft.nick!=null?CREW.draft.nick:S.nick);for(var u in CREW.members){if(u!==CREW.me&&CREW.members[u].nick&&nn&&CREW.members[u].nick.trim()===nn.trim())dup=true}
  var col=CREW.draft&&CREW.draft.color!=null?CREW.draft.color:(S.color||0);
  h+='<h2>'+(S.nick?'프로필 수정':'크루 프로필 만들기')+'</h2><p class="small muted" style="margin:2px 0 12px">크루에는 claude.ai 이름 대신 이 닉네임으로 보여요.'+(S.nick?'':' 닉네임을 정하면 내 훈련 현황이 크루에 공유돼요.')+'</p>';
  if(CREW.needNick)h+='<div class="warn" style="margin-bottom:10px">좋아요와 댓글을 남기려면 먼저 닉네임을 정해 주세요.</div>';
  h+='<form id="pf" style="display:flex;flex-direction:column;gap:12px"><div class="fields" style="margin:0"><label class="full">닉네임 (최대 12자)<input id="pf-nick" maxlength="12" placeholder="예: 하남 서브3" value="'+esc(nn)+'" required></label><label class="full">한마디 (선택, 최대 30자)<input id="pf-bio" maxlength="30" placeholder="예: 3월 동아 서브3 도전" value="'+esc(CREW.draft&&CREW.draft.bio!=null?CREW.draft.bio:S.bio)+'"></label></div>';
  if(dup)h+='<div class="small" style="color:var(--bad)">같은 닉네임을 쓰는 크루가 있어요. 구분되게 바꾸는 걸 추천해요.</div>';
  h+='<div><div class="small muted" style="margin-bottom:6px">프로필 색</div><div class="swatches" role="radiogroup" aria-label="프로필 색">'+AVC.map(function(c,i){return '<button type="button" role="radio" aria-checked="'+(col===i)+'" aria-label="색 '+(i+1)+'" data-col="'+i+'" style="background:'+c+'"></button>'}).join("")+'</div></div>';
  h+='<div class="row"><button class="btn" type="submit">저장</button>'+(S.nick?'<button class="btn ghost" type="button" id="pf-cancel">취소</button>':'')+'</div></form>';

function bindShare(){
  bindCopy();var ih=document.getElementById("inv-how");if(ih)ih.onclick=function(){WMANUAL=true;WSTEP=INVITE_STEP;tab="welcome";render();window.scrollTo(0,0)};
  var t=document.getElementById("share-tog");if(t)t.onchange=function(){S.share=t.checked;save();pushShare(true);keep()};
  var e=document.getElementById("p-edit");if(e)e.onclick=function(){CREW.editP=true;CREW.draft={};keep()};
  var c=document.getElementById("pf-cancel");if(c)c.onclick=function(){CREW.editP=false;CREW.draft=null;keep()};
  var f=document.getElementById("pf");if(!f)return;
  function draft(){CREW.draft=CREW.draft||{};CREW.draft.nick=document.getElementById("pf-nick").value;CREW.draft.bio=document.getElementById("pf-bio").value}

  h+='<div><b>10~20km · 이븐 유지</b><ul class="tight small"><li><span class="go">계속</span> km당 '+P(252)+'~'+P(253)+'(시계) 유지, 심박 '+cap+' 이하</li><li><span class="adj">조정</span> 같은 페이스인데 심박이 '+cap+'을 넘으면 '+P(255)+'로 5초 늦추고 2km 뒤 다시 확인. 오르막에선 페이스 말고 노력도를 유지해요</li></ul></div>';
  h+='<div class="hot"><b>하프 · 목표 결정 지점</b><ul class="tight small"><li><span class="go">계속</span> '+fmtT(5340*K)+'~'+fmtT(5370*K)+' 통과 + 심박 '+cap+' 이하 + 다리·호흡 괜찮음 → 목표 '+fmtT(G)+' 그대로</li><li><span class="adj">조정</span> '+fmtT(lim(21.0975))+'을 넘었거나 심박 '+hi+' 이상이 이어지면 목표를 '+fmtT(fall1)+'~'+fmtT(fall2)+'('+P(259)+'/km)로 바꿔 PB를 노려요. 무리하게 따라잡지 않아요</li></ul></div>';
  h+='<div class="hot"><b>30km · 남은 12km 계산</b><ul class="tight small"><li><span class="go">계속</span> '+fmtT(at(30))+' 안팎 통과면 남은 거리를 '+P(255)+'로만 가도 목표 안이에요. 이제 기록보다 자세: 보폭 유지, 팔치기로 리듬</li><li><span class="adj">조정</span> '+fmtT(lim(30))+'을 넘으면 목표는 '+fmtT(fall2)+' 안쪽 PB로 바꾸고 보급·자세에 집중해요</li></ul></div>';
  h+='<div><b>35km · 마지막 판단</b><ul class="tight small"><li><span class="go">계속</span> '+fmtT(lim(35))+' 안이면 목표 가능. 남은 7.2km는 '+P(253)+'를 지키는 것만 생각해요</li><li><span class="go">올리기</span> 다리가 남아 있으면 40km부터 조금씩 올려요. 35km 전에 올리지 않아요</li></ul></div>';

  return h;
}
