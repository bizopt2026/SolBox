<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header + fixed bottom tab bar; navy track + race-orange from the plan sheets */
:root{--fs-xl:28px;--fs-l:19px;--fs-m:15px;--fs-s:13px;--fs-xs:12px;
  --bg:#f3f5f9; --card:#ffffff; --ink:#111a2e; --muted:#4f5a70;--on-accent:#fff; --line:#dde3ee;
  --navy:#111a2e; --navy-fg:#ffffff;
  --accent:#5b4fd6; --accent-soft:#eeecfc;
  --base:#7fb6f2; --build:#3b82f6; --spec:#1e3a8a; --rec:#c3cbd9; --taper:#0e9384;
  --ok:#2f8f5b; --ok-soft:#e8f5ed; --bad:#d14f4f; --bad-soft:#fbeaea;
  --s5:#6b9ee8;--p5:#8fb8f2;--p4:#93d3a9;--p3:#f3d37c;--p2:#f4b182;--p1:#ef9a9a; --s4:#5cb882; --s3:#d9aa36; --s2:#e88f55; --s1:#e07272;
  --q:#2563eb; --q-soft:#e8f0fe;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#aab3c7;--on-accent:#151c2f; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#9d94ff; --accent-soft:#262342;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#3cc7b4;
  --ok:#93d3a9; --ok-soft:#1d3327; --bad:#ef9a9a; --bad-soft:#3a2222;
  --s5:#8fb8f2; --s4:#93d3a9; --s3:#f3d37c; --s2:#f4b182; --s1:#ef9a9a;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#151c2f; --ink:#e8ecf5; --muted:#aab3c7;--on-accent:#151c2f; --line:#263049;
  --navy:#060a16; --navy-fg:#e8ecf5;
  --accent:#9d94ff; --accent-soft:#262342;
  --base:#5d9be0; --build:#4f8ff7; --spec:#6f8fe8; --rec:#56627c; --taper:#3cc7b4;
  --ok:#93d3a9; --ok-soft:#1d3327; --bad:#ef9a9a; --bad-soft:#3a2222;
  --s5:#8fb8f2; --s4:#93d3a9; --s3:#f3d37c; --s2:#f4b182; --s1:#ef9a9a;
  --q:#7aa7ff; --q-soft:#18264a; color-scheme:dark}
*{box-sizing:border-box}
body{font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-fg)}
header.top .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:padding .2s}
body.compact header.top .wrap{padding-block:6px}
body.compact #brand-eb,body.compact .sync{display:none}
body.compact .brand b{font-size:15px}
body.compact .dday b{font-size:16px}
.brand b,.dday b{transition:font-size .2s}
.sync.gone{display:none}
#fab{display:none!important}
/* bigger invisible hit area for compact buttons */
.recgrp .sbtn,.recgrp .linkbtn,.resact .sbtn,.daynav button{position:relative}
.recgrp .sbtn::after,.recgrp .linkbtn::after,.resact .sbtn::after{content:"";position:absolute;inset:-10px -3px}
/* gentle open motion */
@keyframes fdin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop{animation:fdin .16s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.hco{display:grid;place-items:center}.hco svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}

#brand-eb{display:none}
header.top .wrap{padding-block:8px}
.brand b{font-size:17px!important}
.dday{display:flex;align-items:baseline;gap:6px;flex-direction:row-reverse}
.dday b{font-size:17px!important;display:inline}
.brand{min-width:0;flex:1}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{white-space:nowrap}
.sync{font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.hr-r{gap:6px;flex:none}
.hq{width:30px!important;height:30px!important}
.sync{max-width:64px}
.hr-r{display:flex;align-items:center;gap:10px}
.hq{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--navy-fg);font-weight:800;font-size:15px;flex:none}
#fab span{transition:opacity .15s}
#fab.mini{padding:12px}
.news1{margin:0 0 10px;padding:7px 12px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft)}
.news1>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.news1>summary::-webkit-details-marker{display:none}
.news1>summary>span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news1 .fold-c{color:var(--muted);transition:transform .15s}
.news1[open] .fold-c{transform:rotate(180deg)}
.news1 .linkbtn{font-size:12px;padding:0 2px;min-height:0}
#fab.mini span{display:none}
.resbox{margin:12px 0 4px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.resbox .res{margin:0;padding:0;border:0;background:none}
.resact{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.session .resact .sbtn{display:flex;align-items:center;gap:4px;padding:3px 10px;font-size:12px;font-weight:600}
.resact .chev{margin-left:0;width:14px;height:14px;background:none}
.resact .sbtn[aria-expanded=true] .chev::before{transform:translateY(2px) rotate(-135deg)}
.igbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9}
.resdet{margin-top:8px;border-top:1px solid var(--line)}
.dsec{padding-top:10px}
.dh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
.dh .pill{margin-left:auto;font-size:12px}
.drw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.drw:last-child{border-bottom:0}
.drw>span{color:var(--muted)}
.drw b small{font-size:12px;color:var(--q);font-weight:700}
.drw em{font-style:normal;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsum{margin:0 0 2px;font-size:12px;color:var(--muted)}
.plantb{margin-top:12px;padding:10px 12px 6px;border-radius:12px;background:var(--bg)}
.plantb .dh{margin-bottom:4px}
.lapn{display:inline-block;min-width:16px;color:var(--muted);font-size:12px;font-weight:700}
.drw b small.u{color:var(--muted);font-weight:500}
.dnote{margin:4px 0 0;font-size:12px;color:var(--bad)}
.dsec details.laps{margin-top:4px}
.res{display:flex;gap:14px;align-items:center;margin:12px 0 4px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.ring{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;color:var(--c)}
details.more{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px}
details.more>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:14px;font-weight:700;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
details.more[open]{padding-bottom:10px}
.recgrp{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px}
.session .recgrp .donechip{margin:0;min-width:0;padding:0;border:0;background:none;border-radius:0;gap:8px;font-size:13px;min-height:26px}
.session .recgrp .donechip.todo{margin:0;padding:0;border:0;min-height:26px;font-size:13px;font-weight:500}
.recgrp .donechip>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recgrp .rg-b{display:flex;gap:6px;align-items:center;flex:none}
.session .recgrp .donechip .sbtn{padding:3px 10px;font-size:12px;line-height:1.3;min-height:0}
.recgrp .ftog.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.recgrp .linkbtn{font-size:12px;padding:2px 6px;min-height:0}
.recgrp .linkbtn.dochk{color:var(--accent);font-weight:700}
.recgrp .tdl{color:var(--muted);font-weight:700}
.recgrp .tdo{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;margin-right:6px;vertical-align:-1px}
.recgrp .sreason{margin:6px 0 2px}
.recgrp .fields{margin:8px 6px 4px 0}
.donechip{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800}
.donechip.todo{font-weight:500;border-style:dashed;padding:8px 10px 8px 14px}
.donechip.todo .sbtn{padding:7px 14px;font-size:14px}
.session .donechip,.session .donechip.todo,.session .ifold-h,.session details.more,.session details.laps{margin-top:6px;border:1px solid var(--line);border-style:solid;border-radius:8px;background:var(--card);box-sizing:border-box}
.session .donechip,.session .donechip.todo,.session .ifold-h{min-height:38px;padding:4px 6px 4px 10px;font-size:14px;font-weight:500}
.session .donechip>span:first-child{font-size:14px}
.session .donechip .sbtn,.session .donechip .linkbtn{padding:3px 12px;font-size:13px;min-height:0}
.session .ifold-h{color:var(--muted)}
.session details.more{padding:0 6px 0 10px}
.session details.more>summary{min-height:36px;padding:0;font-size:14px;font-weight:500;box-sizing:border-box}
.session details.more[open]{padding-bottom:8px}
.session .ifold-h .chev{width:22px;height:22px}
.session .zguide+.zguide,.session .zguide+details,.session .zguide+.donechip{margin-top:6px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px 4px;min-height:36px}
.wsn{display:block;font-size:var(--fs-xs);font-weight:800;line-height:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.news{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wlink{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.wlink b{font-size:14px}
.wlink span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn.wset{border-color:var(--accent);color:var(--accent)}
.sbtn.wset.on{background:var(--accent);color:var(--on-accent)}
.wpanel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wcar{font-size:10px;opacity:.7}
.tsvg{width:100%;height:auto;display:block;margin-top:4px}
.tsvg .ax{font-size:10px;fill:var(--muted)}
.wdiet>div{display:grid;grid-template-columns:34px 1fr 30px 28px;gap:8px;align-items:center;padding:3px 0}
.wdiet .sbar100{margin:0}
.wxgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.wxc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;min-width:0}
.wxc b{font-size:var(--fs-l)}
.wxc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxc.now{background:var(--accent-soft);border-color:transparent}
.wxmini{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 22px;align-items:center;gap:4px;width:100%;margin-top:8px}
.wxm{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.wxm b{font-size:17px}
.wxm small{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.wxm.now b{color:var(--accent)}
.wxtop{display:flex;align-items:center;gap:8px}
.wxloc{padding:2px 0;min-height:0;font-weight:600;color:var(--ink);text-decoration:none}
.wxtop .small{margin-left:auto}
.wxre{border:1px solid var(--line);background:var(--card);border-radius:50%;width:30px;height:30px;font-size:14px;line-height:1;flex:none}
.wxrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.wxm{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.wxm b{font-size:17px}
.wxm small{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wxm small.wet{color:var(--s5);font-weight:700}
.wxm.now b{color:var(--accent)}
.wxtip{all:unset;cursor:pointer;display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:13px}
.wxtg{display:grid;place-items:center}
.wxtg .chev{margin:0;background:none;width:auto;height:auto}
.wxtg[aria-expanded="true"] .chev::before{transform:translateY(2px) rotate(-135deg)}
.wxres{display:grid;gap:6px;margin-top:8px}
.wxpick.rec{border-color:var(--ok)}
.wxpick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.bk.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.went{margin-top:8px}
.went-row{display:flex;gap:6px;align-items:center}
.went-l{font-size:12px;font-weight:700;color:var(--muted);flex:none;display:flex;flex-direction:column;line-height:1.15}
.went-l small{font-size:10px;font-weight:600}
.wstep{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;min-width:0;height:34px}
.wstep button{border:0;background:none;width:32px;height:34px;font-size:17px;font-weight:600;color:var(--muted);flex:none}
.wstep button:active{background:var(--accent-soft);color:var(--accent)}
.wstep input{flex:1;min-width:0;border:0;background:none;text-align:right;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);padding:0;outline:none}
.wstep em{font-style:normal;color:var(--muted);font-size:12px;margin:0 4px 0 3px;font-weight:600}
.btn.went-go{background:var(--accent);color:var(--on-accent);padding:0 14px;border-radius:10px;font-size:13px;height:34px;min-height:34px;flex:none}
.went .wwhen{margin-top:4px}
.blist{display:grid;gap:0;margin-top:8px}
.blist>div{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.blist b small{font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.bkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-width:0}
.bk>span{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk b{font-size:var(--fs-l);line-height:1.2}
.bk b small{font-size:var(--fs-xs);color:var(--muted);font-weight:600;margin-left:1px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tgrid .tsvg{margin-top:2px}
.wwhen{margin-top:6px}
.wwhen>summary{cursor:pointer;list-style:none}
.wwhen>summary::-webkit-details-marker{display:none}
.fdiag{margin-top:10px}
.fdiag pre{white-space:pre-wrap;word-break:break-all;font-size:var(--fs-xs);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:240px;overflow:auto;margin:6px 0}
.mplib{border:1px solid var(--line);border-radius:10px;padding:4px 10px 10px;margin-top:6px}
.mplibi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mpsum{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.mpprev{display:grid;gap:2px;margin-top:6px;max-height:420px;overflow:auto}
.mpprev>div{display:grid;grid-template-columns:44px 1fr 40px;gap:6px;align-items:center;padding:6px 2px;border-top:1px solid var(--line)}
.mpdays{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.mpdays span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--card);white-space:nowrap}
.mpdays span i{font-style:normal;color:var(--muted);margin-right:3px}
.mpdays .t-q{border-color:var(--q);color:var(--q)}.mpdays .t-l{border-color:var(--accent);color:var(--accent)}.mpdays .t-r{color:var(--muted)}.mpdays .t-x{border-color:var(--accent);background:var(--accent-soft)}
.mpprev .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fields select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;color:var(--ink)}
.rf{display:inline-block;line-height:0;vertical-align:middle}.rf svg{width:100%;height:100%;display:block}
.rf.none{opacity:.6}
.rf.lg{width:36px;height:36px}.rf.sm{width:16px;height:16px;margin:3px auto 0}.rf.xs{width:15px;height:15px;vertical-align:-3px}.rf.md{width:22px;height:22px}
.rpeb{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rpeb small{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.session .eyebrow,.session .what{padding-right:58px}
.zline{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--muted)}
.zline b{color:var(--ink);font-weight:600}
.rpeask{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.rpeopts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.rpeopts button{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.rpeopts button .rf.lg{width:30px;height:30px}.rpeopts button small{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.rpeopts button[aria-pressed="true"]{border-color:var(--rc);box-shadow:0 0 0 1.5px var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.ws .rf.sm{display:block;margin:3px auto 0}
.rf.ph{opacity:.35}
.fbi{border-top:1px solid var(--line);padding:8px 0}.fbi:first-child{border-top:0}
.drow .dt[data-open]{cursor:pointer}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;font-size:12px;color:#cdc8ff;text-transform:uppercase}
.brand b{display:block;color:var(--navy-fg);letter-spacing:.02em;font-size:var(--fs-l)}
.dday{text-align:right;font-size:12px;opacity:.85}
.dday b{display:block;font-family:var(--f-display);font-size:22px;opacity:1}
.sync{font-size:var(--fs-xs);opacity:.7}

main{padding-block:16px 150px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:500}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Today */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:var(--fs-l);display:flex;align-items:center;gap:4px;padding:0 6px;color:var(--muted);flex:none;padding:0 2px}
.daynav #prev{justify-content:flex-start}.daynav #next{justify-content:flex-end}
.daynav button em{font-style:normal;color:var(--ink);font-size:var(--fs-l);line-height:1}
.daynav button span{font-size:13.5px;font-weight:500;white-space:nowrap}
.daynav button:disabled{opacity:.35}
.daynav .mid{text-align:center;flex:1}
.daynav .mid b{display:block;font-size:var(--fs-l);white-space:nowrap}
.daynav .mid{min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q)}
.session{border-radius:14px;padding:18px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}

.session .what{font-size:var(--fs-l);font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;margin:6px 0 4px}
.session .what.wrap{white-space:normal}
.session.t-q .eyebrow{color:var(--q)} .session.t-l .eyebrow,.session.t-x .eyebrow{color:var(--accent)}
.session.t-q .eyebrow::before,.session.t-l .eyebrow::before,.session.t-x .eyebrow::before{content:"★ "}
.done-btn{width:100%;margin-top:14px;padding:16px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:17px}
.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:44px;line-height:1.2;text-align:left;box-sizing:border-box;padding-left:8px!important;padding-right:6px!important}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0}
.fields input,.fields textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;min-width:0}
.fields .full{grid-column:1/-1}
.fields select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;width:100%;min-width:0;color:var(--ink);-webkit-appearance:none;appearance:none}
.rlist{display:grid;gap:6px;margin-top:12px}
.rli{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;color:var(--ink)}
.rli>span:first-child{display:flex;flex-direction:column;gap:2px}
.rli.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rh{margin:16px 0 6px;color:var(--ink);font-size:15px}
.rsvg{width:100%;height:auto;display:block}
.rchart{position:relative;touch-action:pan-y;cursor:crosshair}
.rcur{position:absolute;width:1px;margin-left:-.5px;background:var(--muted);opacity:.6;pointer-events:none}
.rdot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card);pointer-events:none}
.rdot.act{background:var(--ink)}
.rtip{position:absolute;top:-6px;transform:translateY(-100%);display:flex;flex-direction:column;gap:1px;padding:6px 9px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:2}
.rtip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.rtip small{opacity:.75}
.rtip .muted{color:inherit;opacity:.7}
.ftip{position:fixed;transform:none;top:0;z-index:30}
[data-tip]{cursor:default}
.wdiet>div[data-tip]{border-radius:6px}
.rsvg .ax{font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.rleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.rleg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rseg{display:grid;gap:8px}
.rseg>div{border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.rcp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.rcase{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin-top:6px}
.rcase>span{font-size:12px;font-weight:700}
.rcase.k0{border-color:var(--s5)}.rcase.k0>span{color:var(--s5)}
.rcase.k1{border-color:var(--ok)}.rcase.k1>span{color:var(--ok)}
.rcase.k2{border-color:var(--bad)}.rcase.k2>span{color:var(--bad)}
.rscore{display:flex;gap:14px;align-items:flex-start}
.rscore>div:first-child{flex:none;width:86px;height:86px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;align-content:center;color:var(--accent)}
.rscore>div:first-child b{font-family:var(--f-display);font-size:34px;line-height:1}
.rscore>div:first-child span{font-size:12px}
.rbar{margin-bottom:8px}
.rbar i{display:block;height:6px;border-radius:3px;background:var(--line);margin:3px 0 2px;overflow:hidden}
.rbar u{display:block;height:100%;background:var(--accent)}
textarea{resize:vertical;min-height:64px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ws{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;background:var(--card);font-size:12px}
.ws b{display:block;font-size:13px}
.ws .dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.ws.done .dot{background:var(--ok)} .ws.miss .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--s1)}
.ws .kstar{font-style:normal;font-size:10px;color:var(--accent);margin-right:1px}
.slg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.slg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.slg i.miss{box-shadow:inset 0 0 0 2px var(--s1)}
.sreason{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.sreason b{font-size:13px}
.sbar100{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 2px}
.sbar100 i{display:block;height:100%}
.ck:has(.ckn){padding:0}
.ck .ckn{display:block;width:100%;text-align:center;font-size:15px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ck .ckn.n3{font-size:13px;letter-spacing:-.05em}
.ws.sel{border-color:var(--ink);border-width:2px}
.ws.t-q b{color:var(--q)} .ws.t-l b,.ws.t-x b{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

/* Plan */
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wk>summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;cursor:pointer}
.wk>summary::-webkit-details-marker{display:none}
.wk .stripe{align-self:stretch;border-radius:4px;background:var(--rec)}
.wk .wn{font-family:var(--f-display);font-weight:800;font-size:var(--fs-l)}
.wk .wsub{font-size:12px;color:var(--muted)}
.wk .wr{text-align:right;font-size:12px;color:var(--muted)}
.wk .wr b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.wk.cur{border-color:var(--ink);border-width:2px}
.drow{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.drow .dl{font-size:12px;color:var(--muted);line-height:1.2}
.drow .dl b{display:block;font-size:15px;color:var(--ink)}
.drow .dt{font-size:14px;white-space:pre-line;min-width:0}
.drow.t-q .dt{color:var(--q)} .drow.t-l .dt,.drow.t-x .dt{color:var(--accent);font-weight:500}
.drow.t-r .dt{color:var(--muted)}
.drow.today{background:var(--accent-soft)}
.ck{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:var(--fs-l);color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.drow .act{font-size:12px;color:var(--ok)}

/* Records */
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.wlist{display:flex;flex-direction:column;max-height:220px;overflow:auto}
.wlist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wlist button{border:0;background:none;color:var(--muted);padding:0 4px}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.cp{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0}
.cp .goal{font-family:var(--f-display);font-weight:800;color:var(--q);font-size:16px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--line);color:var(--muted)}
.runlist{display:flex;flex-direction:column;margin-top:8px}
.runlist div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.runlist .r2{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sbar .btn{white-space:nowrap}
.btn[disabled]{opacity:.5}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}

/* Guide */
.zone .zn{color:var(--accent);font-weight:700;margin-left:1px;line-height:0;font-size:12px;vertical-align:4px}
.znote{font-size:12px;color:var(--muted);margin:2px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg)}
.zone{display:grid;grid-template-columns:var(--znw,118px) minmax(36px,1fr) 108px;gap:8px;align-items:start;padding:5px 0;font-size:14px;min-height:44px}
.zone.z3{min-height:58px}
.zone .zn0{white-space:nowrap;line-height:22px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:-.01em}
.zone .zb{margin-top:6px}
.zone .zp{line-height:22px}
.zone .zb{height:10px;border-radius:99px;background:var(--line);position:relative}
.zone .zb i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.zone .zp{text-align:right;font-family:var(--f-display);font-weight:700}
.zone .zp small{display:block;font-family:var(--f-body);font-weight:400;font-size:var(--fs-xs);white-space:nowrap;line-height:1.4}
.zone .zp .hr{color:var(--bad)}
.zone .zp small.lap{color:var(--q);font-weight:700}
.zone .zp .lap{color:var(--q);font-weight:700}
.zone .zp .og{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px}
.mini b{display:block;font-family:var(--f-display);font-size:var(--fs-l)}
.race{display:grid;gap:8px}
.race>div{border-radius:12px;padding:12px 14px;background:var(--navy);color:var(--navy-fg)}
.race>div.hot{background:var(--build);color:#fff}
.race>div.end{background:var(--accent);color:var(--on-accent)}
.race b{font-family:var(--f-display);font-size:var(--fs-l)}
ul.tight{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}

.wel{display:flex;flex-direction:column;gap:14px}
.wel-top{display:flex;justify-content:space-between;align-items:center}
.wel-dots{display:flex;gap:6px}
.wel-dots i{width:22px;height:5px;border-radius:99px;background:var(--line)}
.wel-dots i.on{background:var(--accent)}
.skip{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 0}
.wel-hero{background:var(--navy);color:var(--navy-fg);border-radius:16px;padding:22px 18px}
.wel-hero .eyebrow{color:#cdc8ff}
.wel-hero h1{font-family:var(--f-display);font-size:var(--fs-xl);line-height:1.25;margin:8px 0 6px;text-wrap:balance}
.wel-hero p{margin:0;opacity:.85;font-size:14px}
.wel h2{font-size:var(--fs-l)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;counter-increment:st}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.demo{border:1px dashed var(--line);border-radius:14px;padding:14px;background:var(--card);position:relative}
.demo .tag{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 6px;font-size:var(--fs-xs);color:var(--muted);font-weight:700;letter-spacing:.06em}
.phase-row{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;margin-top:12px}
.phase-row i{height:22px;border-radius:4px}
.linkbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.linkbox input{font-size:13px;font-family:var(--f-display)}
.who{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--q-soft);color:var(--q);margin-bottom:6px}
.gopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gopt{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.gopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gopt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gopt .gt{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.gopt .gn{font-weight:700;font-size:13px;align-self:center;text-align:right}
.gopt .gd{grid-column:1/-1;font-size:13px;color:var(--muted)}
.goal-hero{background:var(--navy);color:var(--navy-fg);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal-hero .eyebrow{color:#cdc8ff}
.goal-hero b{font-family:var(--f-display);font-size:var(--fs-xl);display:block}
.adm-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-confirm{grid-column:1/-1;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.btn.danger{background:var(--bad);color:#fff}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-line}
.wg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.wg summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.wg summary::-webkit-details-marker{display:none}
.wg summary::after{content:"＋";color:var(--muted);font-weight:400}
.wg[open] summary::after{content:"－"}
.fold-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;min-width:0;width:100%;border-radius:8px}
.fold-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold-h h2{margin:0;white-space:nowrap}
.fold-s{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.chev{flex:none;margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--bg)}
.chev::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.fold-h[aria-expanded="true"] .chev::before{transform:translateY(2px) rotate(-135deg)}
.card.folded{padding-block:12px}
details.mpfold>summary{list-style:none}
details.mpfold>summary::-webkit-details-marker{display:none}
details.mpfold[open]>summary{margin-bottom:4px}
[hidden]{display:none!important}
.ifold-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);background:var(--card)}
.ifold-h:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;min-height:24px}
.srow+.srow{border-top:1px solid var(--line)}
.ssum{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 4px;font-size:13px;white-space:nowrap}
.ssum>span:not(.fold-c){min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:0 4px}
.ssum>span:not(.fold-c)+span:not(.fold-c){border-left:1px solid var(--line)}
.ssum .fold-c,.sfold span{color:var(--muted)}
.ssum .fold-c{transition:transform .15s}
.ssum[aria-expanded=true] .fold-c{transform:rotate(180deg)}
.strip .ssum{background:transparent;box-shadow:none!important;border-radius:0;padding:10px 0 10px 0;margin:0 -4px;width:calc(100% + 8px);border-bottom:1px solid var(--line)!important}
.sfold{all:unset;cursor:pointer;align-self:center;font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);width:100%;text-align:center;box-sizing:border-box}

.srow .sl{flex:none;width:22px;text-align:center}
.srow .sm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sm b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.sbtn[disabled]{opacity:.5}
.keys{display:flex;flex-direction:column;margin-top:6px}
.key{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.key:first-child{border-top:0}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.key .kd{display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.3}
.key .kd b{font-size:14px;color:var(--ink);font-family:var(--f-display)}
.key .kt{font-size:14px;min-width:0}
.key.t-q .kd span{color:var(--q)} .key.t-l .kd span,.key.t-x .kd span{color:var(--accent)}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.segm button{border:0;background:transparent;padding:4px 12px;font-size:13px;font-weight:700;color:var(--muted)}

function distScore(v,plan){if(!(v>0)||!plan)return 4;return band(Math.round(100*Math.pow(Math.min(1,v/plan),1.5)))}
function memStats(m,w){
  var d=(m&&m.d)||{},done=0,n=0,km=0,dots=[];
  for(var k=0;k<7;k++){var ds=dateOf(w,k),t=W[w].d[k],ok=d[ds]!==undefined;
    if(t[0]!=="r"){n++;if(ok)done++}if(ok)km+=d[ds]>0?d[ds]:t[2];
    var pk=m&&m.pk&&m.pk[ds];if(pk)t=[pk[0],"",pk[1]];
    dots.push(t[0]==="r"?(d[ds]>0?"extra":"rest"):ok?"s"+distScore(d[ds],t[2]):(ds<T?"no":(m&&m.pm==="mine"?"":"")))}
  var tot=0,dn=0,last=Math.min(TOTAL,idxOf(T)+1);
  for(var i=0;i<last;i++){var ds2=dateOf(Math.floor(i/7),i%7),t2=W[Math.floor(i/7)].d[i%7];if(t2[0]!=="r"){tot++;if(d[ds2]!==undefined)dn++}}
  return{done:done,n:n,km:Math.round(km*10)/10,dots:dots,rate:tot?Math.round(dn/tot*100):null,dn:dn,tot:tot};
}

    var sg=null;for(var i=0;i<d.s.length;i++){var q=d.s[i];if(km>=q[0]&&km<=q[0]+q[1]/1000+1e-6){sg=q;break}}if(!sg)sg=d.s[d.s.length-1];
    var ki=Math.min(Math.floor(km),Math.ceil(d.D)-1),av=d.a&&d.a[ki]?d.a[ki]:null,el=d.e?d.e[Math.min(d.e.length-1,Math.round(km))]:null;
    function Y(p){return d.T+(Math.min(Math.max(p,d.mn),d.mx)-d.mn)/(d.mx-d.mn)*d.h}
    var px=(d.L+km/d.D*d.w)/d.W*100,cur=c.querySelector(".rcur"),dt=c.querySelectorAll(".rdot"),tp=c.querySelector(".rtip");
    cur.hidden=false;cur.style.left=px+"%";cur.style.top=(d.T/d.H*100)+"%";cur.style.height=(d.h/d.H*100)+"%";
    dt[0].hidden=false;dt[0].style.left=px+"%";dt[0].style.top=(Y(sg[2])/d.H*100)+"%";
    if(av){dt[1].hidden=false;dt[1].style.left=px+"%";dt[1].style.top=(Y(av)/d.H*100)+"%"}else dt[1].hidden=true;
    tp.innerHTML='<b>'+(Math.round(km*10)/10)+'km</b><span><i style="background:var(--accent)"></i>목표 '+fmtMS(sg[2])+'/km</span>'+(av?'<span><i style="background:currentColor"></i>실제 '+fmtMS(av)+'/km'+(av-sg[2]?' <small>('+(av>sg[2]?'+':'−')+Math.abs(Math.round(av-sg[2]))+'초)</small>':'')+'</span>':'')+(el!=null?'<span class="muted">고도 '+el+'m</span>':'');
    tp.hidden=false;var tw=tp.offsetWidth,cw=c.clientWidth,lx=px/100*cw;tp.style.left=Math.max(0,Math.min(cw-tw,lx-tw/2))+"px"}
  view.addEventListener("pointermove",show);view.addEventListener("pointerdown",show);
  view.addEventListener("pointerleave",function(){view.querySelectorAll(".rchart").forEach(hide)},true);
  document.addEventListener("pointerdown",function(e){if(!(e.target.closest&&e.target.closest(".rchart")))view.querySelectorAll(".rchart").forEach(hide)});
})();
