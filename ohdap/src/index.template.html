<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오답노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">
<!--KATEX_CSS-->
<style>
:root{
  --bg:#FAF8F3;--surface:#FFFFFF;--ink:#1C2333;--muted:#4A5262;--line:#E6E1D6;--chip:#EFEBE2;
  --primary:#1F5F4A;--primary-ink:#FFFFFF;--primary-soft:#E4EFE9;
  --board:#1F3A33;--chalk:#F3F1E8;--chalk-dim:#A9BDB4;--marker:#F2C14E;
  --ok:#1E3FA8;--ok-soft:#E3EAFB;--bad:#8A3209;--bad-soft:#FBEDE5;--warn-soft:#FDF1D3;--warn-ink:#6A4100;
  --stripe1:#EEEAE0;--stripe2:#E4DFD2;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181D;--surface:#1E232A;--ink:#ECEAE4;--muted:#A9B0BC;--line:#323843;--chip:#262C34;
    --primary:#3F9C7C;--primary-ink:#0E1A15;--primary-soft:#1F3A31;
    --board:#16302A;--chalk:#F3F1E8;--chalk-dim:#93A89F;--marker:#F2C14E;
    --ok:#8EAAF5;--ok-soft:#1E2A47;--bad:#F2A07A;--bad-soft:#3A2419;--warn-soft:#3A2F14;--warn-ink:#F2D58E;
    --stripe1:#262C34;--stripe2:#2E353E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181D;--surface:#1E232A;--ink:#ECEAE4;--muted:#A9B0BC;--line:#323843;--chip:#262C34;
  --primary:#3F9C7C;--primary-ink:#0E1A15;--primary-soft:#1F3A31;
  --board:#16302A;--chalk:#F3F1E8;--chalk-dim:#93A89F;--marker:#F2C14E;
  --ok:#8EAAF5;--ok-soft:#1E2A47;--bad:#F2A07A;--bad-soft:#3A2419;--warn-soft:#3A2F14;--warn-ink:#F2D58E;
  --stripe1:#262C34;--stripe2:#2E353E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
a{color:var(--primary);text-decoration:none}
button{font:inherit;color:inherit}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.loading{padding:40px 20px;color:var(--muted)}
.screen{min-height:100vh;padding-bottom:24px}
.screen.has-tabbar{padding-bottom:110px}
.page{padding:0 20px;display:flex;flex-direction:column;gap:16px}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:4px}
.top-title{margin:0;font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn,.iconbtn-space{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:12px}
.home-head{padding:24px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.h-big{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px}
.h2{margin:0;font-size:18px;font-weight:700}
.lead{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
.muted{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.center{text-align:center}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grade-btn{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:17px;cursor:pointer}
.grade-btn.on{border:2px solid var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;cursor:pointer;padding:0 16px;text-align:center}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.dark{background:var(--board);color:var(--chalk);border-color:var(--board)}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.badge{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.badge.due{background:var(--warn-soft);color:var(--warn-ink)}
.badge.done{background:var(--primary-soft);color:var(--primary)}
.onboard{padding:40px 24px 120px;display:flex;flex-direction:column;gap:18px}
.logo{width:80px;height:80px;border-radius:26px;background:var(--board);color:var(--marker);display:flex;align-items:center;justify-content:center}
.bottom-cta{position:fixed;left:0;right:0;bottom:0;padding:16px 24px 28px;background:linear-gradient(to top,var(--bg) 70%,transparent);max-width:520px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:80px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;max-width:520px;margin:0 auto;z-index:5}
.tab{width:88px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tab.on{color:var(--primary);font-weight:700}
.tab-plus{width:56px;height:56px;margin-top:-22px;border-radius:999px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(31,95,74,.3)}
.device-note{margin:0;font-size:13px;color:var(--warn-ink);background:var(--warn-soft);padding:8px 12px;border-radius:10px;align-self:flex-start}
.store-where{margin:0;font-size:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:14px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.input{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:16px;color:var(--ink);width:100%}
textarea.input{height:auto;padding:12px;line-height:1.6;resize:vertical}
.stripe{background:repeating-linear-gradient(135deg,var(--stripe1) 0 8px,var(--stripe2) 8px 16px)}
.math-raw{font-family:'STIX Two Text',serif;font-style:italic}
.mtext{font-size:17px;line-height:1.75}
.mtext .katex{font-size:1.08em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pick{height:160px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:600;cursor:pointer}
.pick-cam{border:0;background:var(--primary);color:var(--primary-ink)}
.pick-album{border:1.5px dashed var(--muted);background:var(--surface)}
.preview{position:relative;border-radius:18px;overflow:hidden;background:var(--chip)}
.preview img{display:block;width:100%;max-height:300px;object-fit:contain}
.retake{position:absolute;right:10px;bottom:10px;height:40px;padding:0 14px;border-radius:999px;border:0;background:rgba(28,35,51,.82);color:#fff;font-size:14px;cursor:pointer}
.notice{padding:14px;border-radius:12px;background:var(--chip);font-size:15px;line-height:1.6}
.notice.warn{background:var(--warn-soft);color:var(--warn-ink)}
.msg:empty,.choose:empty{display:none}
.choose{display:flex;flex-direction:column;gap:8px}
.btn.choice{justify-content:flex-start;text-align:left;font-weight:500}
.btn.small{min-height:36px;font-size:13px;padding:0 12px;border-radius:10px;background:var(--bg)}
.psteps{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pstep{display:flex;align-items:center;gap:6px}
.pstep.on,.pstep.done{color:var(--primary);font-weight:600}
.pnum{width:22px;height:22px;border-radius:999px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px}
.pstep.done .pnum{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.pline{flex:1;height:2px;background:var(--line)}
.confirm-head{display:flex;gap:12px}
.thumb{width:96px;height:96px;flex:none;border-radius:12px;object-fit:cover}
.confirm-meta{display:flex;flex-direction:column;gap:6px}
.tag{padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edit-box{display:flex;flex-direction:column;gap:6px}
.choices{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.choices:empty{display:none}
.hint{display:flex;gap:8px}
.linkish{border:0;background:none;color:var(--primary);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;min-height:44px}
.photo-full{width:100%;border-radius:12px}
.answer-card{padding:14px;border-radius:14px;display:flex;flex-direction:column;gap:4px}
.answer-card.ok{background:var(--ok-soft);color:var(--ok)}
.answer-card.bad{background:var(--bad-soft);color:var(--bad)}
.answer-label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.answer-val{font-family:'STIX Two Text',serif;font-size:28px;line-height:1.3}
.answer-long{font-size:14px}
.why{padding:16px;border-radius:14px;background:var(--warn-soft);display:flex;flex-direction:column;gap:6px}
.why .h3{color:var(--warn-ink)}
.h3{margin:0;font-size:16px;font-weight:700}
.why-text{margin:0;font-size:15px;line-height:1.65}
.board-link{min-height:60px}
.play-dot{width:36px;height:36px;border-radius:999px;background:var(--marker);color:#1C2333;display:flex;align-items:center;justify-content:center}
.sec{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--chip)}
.tab-btn{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.tab-btn.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.step-n{width:26px;height:26px;flex:none;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-body{display:flex;flex-direction:column;gap:6px;min-width:0;overflow-x:auto}
.step-board{font-size:18px}
.step-say{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.concept-name{font-size:15px;font-weight:600}
.formula{text-align:center;padding:10px 0;background:var(--bg);border-radius:10px;overflow-x:auto}
.concept-sum{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.kid-concept{border:2px solid var(--primary)}
.mistakes{margin:0;padding:16px 16px 16px 34px;font-size:14px;line-height:1.6}
.due-text{font-size:13px;font-weight:600;color:var(--warn-ink)}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.ladder li{display:flex;flex-direction:column;gap:6px}
.ladder .bar{height:8px;border-radius:4px;background:var(--line)}
.ladder .done .bar{background:var(--primary)}
.ladder .on{color:var(--ink);font-weight:600}
.ladder .on .bar{background:var(--marker)}
.small{font-size:12px}
.fix{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.fix summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.fix[open]{gap:10px}
.fix textarea{margin:10px 0}
.danger-link{border:0;background:none;color:var(--bad);font-weight:500}
.star.on{color:#B7791F}
.star.on svg{fill:var(--marker)}
.column-calc{display:flex;justify-content:center;font-family:'STIX Two Text',serif;align-self:center}
.col{width:44px;display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 0}
.col.focus{background:rgba(242,193,78,.2)}
.col-mark{height:22px;font-size:16px;font-weight:700;color:#B7791F;font-family:'IBM Plex Sans KR',sans-serif}
.col-a,.col-b,.col-result{height:44px;font-size:34px;line-height:44px}
.col-a.struck{text-decoration:line-through;text-decoration-color:var(--marker);text-decoration-thickness:3px;opacity:.6}
.col-line{align-self:stretch;height:3px;background:currentColor;margin:4px 0}
.col-result{font-weight:700}
.board-screen{background:var(--board);color:var(--chalk);min-height:100vh;display:flex;flex-direction:column;padding-bottom:0}
.board-screen .iconbtn{color:var(--chalk)}
.board-pos{width:44px;text-align:center;font-size:13px;color:var(--chalk-dim)}
.board-bars{display:flex;gap:4px;padding:0 20px}
.board-bars span{flex:1;height:4px;border-radius:2px;background:rgba(243,241,232,.2)}
.board-bars span.on{background:var(--marker)}
.board-main{flex:1;padding:24px 24px 20px;overflow-y:auto;max-height:calc(100vh - 330px)}
.board-problem{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--chalk-dim)}
.board-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.bstep{display:flex;align-items:baseline;gap:14px;padding:6px 10px;margin:0 -10px;border-radius:10px}
.bstep.current{background:rgba(242,193,78,.12)}
.bnum{font-size:14px;font-weight:700;color:var(--chalk-dim);flex:none}
.bstep.current .bnum{color:var(--marker)}
.btext{font-size:24px;line-height:1.5;font-family:'STIX Two Text',serif}
.bstep.past .btext,.bstep.past .column-calc{color:var(--chalk-dim)}
.bstep.current .btext{text-decoration:underline;text-decoration-color:var(--marker);text-decoration-thickness:3px;text-underline-offset:6px}
.board-screen .col-mark{color:var(--marker)}
.board-screen .col.focus{background:rgba(242,193,78,.16)}
.caption-box{margin:0 16px;padding:16px;border-radius:14px;background:rgba(0,0,0,.28);display:flex;gap:10px;color:var(--marker)}
.caption{margin:0;font-size:16px;line-height:1.65;color:var(--chalk);min-height:52px}
.board-ctl{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 32px}
.bctl{min-width:64px;height:44px;border-radius:999px;border:1px solid rgba(243,241,232,.35);background:transparent;color:var(--chalk);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer}
.bctl.ghost{border:0}
.bctl.round{min-width:52px;width:52px;height:52px;border:0;background:rgba(243,241,232,.12)}
.bplay{width:72px;height:72px;border-radius:999px;border:0;background:var(--marker);color:#1C2333;display:flex;align-items:center;justify-content:center;cursor:pointer}
body.kid .caption{font-size:18px}
body.kid .bplay{width:84px;height:84px}
body.kid .board-screen .col-a,body.kid .board-screen .col-b,body.kid .board-screen .col-result{font-size:46px;height:56px;line-height:56px}
body.kid .board-screen .col{width:56px}
.today-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.today-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg)}
.today-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.today-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.pill{min-height:40px;border-radius:999px;font-size:14px}
.got{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:0 8px;min-height:40px}
.got.ok{color:var(--ok)}.got.bad{color:var(--bad)}
.progress{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.progress span{display:block;height:8px;background:var(--marker)}
.stat{padding:14px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:20px}
.stat.done{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.stars{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--ink)}
.stars svg{fill:var(--marker);stroke:#B7791F}
.tag.soft{align-self:flex-start;background:var(--primary-soft);color:var(--primary);border-color:transparent;font-weight:600}
.big-q{font-size:18px}
.answer-input{height:56px;font-family:'STIX Two Text',serif;font-size:22px}
.choice-btns{display:flex;flex-direction:column;gap:8px}
.drill-result{display:flex;flex-direction:column;gap:10px}
.drill-result:empty{display:none}
.result{padding:18px;border-radius:16px;display:flex;flex-direction:column;gap:8px}
.result p{margin:0;font-size:15px;line-height:1.6;color:var(--ink)}
.result.ok{background:var(--ok-soft)}.result.bad{background:var(--bad-soft)}
.result-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.result.ok .result-title{color:var(--ok)}.result.bad .result-title{color:var(--bad)}
.drill-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.drill-hist a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-height:44px}
.hist-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
body.kid .answer-input{height:68px;font-size:30px;text-align:center}
body.kid .result-title{font-size:22px}
.note-list{display:flex;flex-direction:column;gap:10px}
.note-item{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);align-items:center}
.nthumb{width:56px;height:56px;flex:none;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.nbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ntitle{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nstar{color:#B7791F}.nstar svg{fill:var(--marker)}
.group-title{margin:8px 0 0;font-size:14px;color:var(--muted)}
.empty{padding:24px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);text-align:center}
.empty p{margin:4px 0}
.today-card{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:var(--board);color:var(--chalk)}
.today-card-text{flex:1;display:flex;flex-direction:column;gap:4px}
.today-card-text b{font-size:19px}
.pill-marker{padding:10px 16px;border-radius:999px;background:var(--marker);color:#1C2333;font-weight:600}
.pill-dark{padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search-input{flex:1;border:0;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--ink);min-width:0}
.row-gap{display:flex;gap:12px}
.notice.migrate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn-ink)}
.small-btn{min-height:40px;font-size:14px}
.kid-shoot{min-height:120px;border-radius:24px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;gap:18px;padding:0 22px}
